<style>
/* ══════════════════════════════════════════
   IRON STUFFER v3 — DESIGN SYSTEM
   Light mode (default) + Dark mode toggle
   ══════════════════════════════════════════ */
:root {
  /* Couleurs principales */
  --gold:#7c5cbf; --gold2:#9b7fd4; --gold-glow:#a87ee8;
  --gold-light:rgba(124,92,191,0.08); --gold-border:rgba(124,92,191,0.25);
  --green:#2ecc71; --green-bg:rgba(46,204,113,0.08);
  --yellow:#f39c12; --red:#e74c3c;

  /* Light mode surfaces */
  --bg:#fdfcff; --bg2:#f5f3fa; --bg3:#ede9f7; --surface:#fff;
  --surface-glass:rgba(255,255,255,0.72);
  --border:rgba(124,92,191,0.15); --text:#1a1025; --text-dim:#8878a8;

  /* Ombres */
  --radius:12px;
  --shadow:0 2px 8px rgba(124,92,191,0.10),0 6px 24px rgba(124,92,191,0.08);
  --shadow-hover:0 4px 16px rgba(124,92,191,0.18),0 8px 32px rgba(124,92,191,0.12);
  --shadow-card:0 1px 3px rgba(124,92,191,0.07),0 4px 16px rgba(124,92,191,0.10);

  /* Transitions */
  --t-fast:0.15s ease; --t-med:0.25s ease; --t-spring:0.35s cubic-bezier(0.34,1.56,0.64,1);
}

/* ── DARK MODE ── */
[data-theme="dark"] {
  --bg:#0f0a1a; --bg2:#1a1030; --bg3:#231540; --surface:#160e2a;
  --surface-glass:rgba(22,14,42,0.80);
  --border:rgba(168,126,232,0.20); --text:#ede8ff; --text-dim:#8878a8;
  --gold:#a87ee8; --gold2:#c4a6f5; --gold-glow:#d0b8ff;
  --gold-light:rgba(168,126,232,0.12); --gold-border:rgba(168,126,232,0.30);
  --shadow:0 2px 8px rgba(0,0,0,0.40),0 6px 24px rgba(168,126,232,0.08);
  --shadow-hover:0 4px 20px rgba(168,126,232,0.25),0 8px 40px rgba(0,0,0,0.40);
  --shadow-card:0 1px 4px rgba(0,0,0,0.35),0 4px 20px rgba(168,126,232,0.10);
}

/* ── BASE ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background var(--t-med),color var(--t-med)}
input,button,select{font-family:'Rajdhani',sans-serif}

/* ── KEYFRAMES ── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slotPop{0%{transform:scale(1)}40%{transform:scale(1.055)}70%{transform:scale(0.97)}100%{transform:scale(1)}}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── HEADER ── */
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(253,252,255,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--gold-border);display:flex;align-items:center;padding:0 16px;height:52px;transition:background var(--t-med),border-color var(--t-med)}
[data-theme="dark"] .hdr{background:rgba(15,10,26,0.88)}
.hdr-title{font-family:'Cinzel',serif;font-size:15px;font-weight:700;color:var(--gold);letter-spacing:4px;text-transform:uppercase;flex-shrink:0;transition:color var(--t-fast),font-size var(--t-med),letter-spacing var(--t-med)}
.hdr-title.large{font-size:20px;letter-spacing:6px}
.hdr-sub{font-size:11px;color:var(--text-dim);letter-spacing:1.5px}
.hdr-sub.hidden{display:none}
.hidden{display:none}

/* Dark mode toggle */
.theme-toggle{background:none;border:1px solid var(--gold-border);border-radius:20px;color:var(--gold);font-size:14px;cursor:pointer;padding:3px 10px;margin-left:8px;transition:all var(--t-fast);white-space:nowrap;line-height:1.4}
.theme-toggle:hover{background:var(--gold-light);border-color:var(--gold)}

/* Bouton Modifier/Enregistrer */
.edit-mode-btn{background:var(--bg2);border:1.5px solid var(--gold-border);border-radius:20px;color:var(--gold);font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.5px;cursor:pointer;padding:5px 12px;white-space:nowrap;transition:all var(--t-fast);flex-shrink:0;margin-right:10px}
.edit-mode-btn:hover{background:var(--gold-light);border-color:var(--gold)}
.edit-mode-btn.editing{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 0 10px var(--gold-border)}

/* Verrouillage lecture seule */
.view-locked .tracking-check,
.view-locked .jetons-input,
.view-locked .dofus-cell,
.view-locked .kamas-input{pointer-events:none;opacity:0.55;filter:grayscale(0.35)}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(253,252,255,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--gold-border);display:flex;padding:6px 0;padding-bottom:max(6px,env(safe-area-inset-bottom));position:fixed;transition:background var(--t-med),border-color var(--t-med)}
[data-theme="dark"] .bottom-nav{background:rgba(15,10,26,0.88)}
.bnav-inner{display:flex;flex:1;position:relative}
.bnav-pill{position:absolute;top:1px;bottom:1px;border-radius:14px;background:radial-gradient(circle,var(--gold-light) 0%,rgba(124,92,191,0) 72%);box-shadow:0 0 14px 1px var(--gold-border),inset 0 0 10px var(--gold-light);transition:left var(--t-spring),width var(--t-spring),background var(--t-fast);pointer-events:none}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--text-dim);font-family:'Rajdhani',sans-serif;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;padding:3px 0;transition:color var(--t-fast);position:relative}
.bnav-btn .ico{font-size:20px;display:flex;align-items:center;justify-content:center;width:26px;height:26px;transition:transform var(--t-spring)}
.bnav-btn.active{color:var(--gold)}
.bnav-btn.active .ico{transform:scale(1.15);filter:drop-shadow(0 0 6px var(--gold-border))}

/* ── CONTENT & VIEW TRANSITIONS ── */
.content{padding-top:60px;padding-bottom:70px;min-height:100vh}
.view{display:none;opacity:0}
.view.active{display:block;animation:fadeSlideIn 0.22s ease forwards}

/* ── STATS COMPACTES (banque/overlay) ── */
.stat-chip{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--bg2)}
.stat-chip.exo{background:var(--gold-light);color:var(--gold);border:1px solid var(--gold-border)}

/* ── BANQUE ── */
.bank-header{padding:16px;display:flex;align-items:center;justify-content:space-between}
.bank-add-btn{background:var(--gold-light);border:1px solid var(--gold-border);color:var(--gold);font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;padding:8px 14px;border-radius:8px;cursor:pointer;transition:all var(--t-fast)}
.bank-add-btn:hover{background:rgba(124,92,191,0.18);transform:translateY(-1px)}
.bank-filters{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto}
.bank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:0 12px 12px}
#bankSentinel{grid-column:1/-1}
.bank-card{background:var(--surface-glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-card);transition:box-shadow var(--t-fast),transform var(--t-fast);position:relative}
.bank-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.bank-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.bank-card-ico{width:40px;height:40px;object-fit:contain;border-radius:8px;background:var(--bg2);border:1px solid var(--border);flex-shrink:0}
.bank-card-actions{display:flex;gap:3px}
.bank-card-actions button{background:var(--bg2);border:1px solid var(--border);color:var(--text-dim);width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:all var(--t-fast);padding:0}
.bank-card-actions button:hover{border-color:var(--gold);color:var(--gold)}
.bank-card-name{font-family:'Cinzel',serif;font-size:12px;font-weight:700;color:var(--text);letter-spacing:0.2px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bank-card-type{font-size:9px;color:var(--text-dim);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.bank-card-exos{display:flex;flex-wrap:wrap;gap:3px}
.bank-card-compte{margin-top:auto;padding-top:4px;font-size:9px;color:var(--gold);font-weight:700;letter-spacing:0.5px;border-top:1px solid var(--gold-light)}

/* ── MODALS ── */
.modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:16px}
.modal-overlay.active{display:flex}
.modal{background:var(--surface);border-radius:20px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:20px;border:1px solid var(--gold-border);box-shadow:0 8px 40px rgba(124,92,191,0.18)}
.modal-title{font-family:'Cinzel',serif;font-size:14px;font-weight:700;color:var(--gold);letter-spacing:2px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.modal-close{background:none;border:none;font-size:22px;color:var(--text-dim);cursor:pointer;padding:0 4px;transition:color var(--t-fast)}
.modal-close:hover{color:var(--gold)}
.modal-item-preview{background:var(--bg2);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.modal-item-preview img{width:40px;height:40px;object-fit:contain;border-radius:6px}
.modal-item-preview-name{font-family:'Cinzel',serif;font-size:13px;font-weight:700;color:var(--text)}
.modal-item-preview-type{font-size:10px;color:var(--text-dim);font-weight:700;letter-spacing:1.5px}
.modal-section-title{font-size:9px;color:var(--text-dim);font-weight:700;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:8px}
.stat-edit-grid{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.stat-edit-input{width:70px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:13px;font-weight:700;color:var(--gold);text-align:right;font-family:'Cinzel',serif}
.exo-row{background:var(--gold-light);border:1px solid var(--gold-border);border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:8px}
.exo-name{font-size:12px;font-weight:700;color:var(--gold);flex:1}
.compte-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.compte-chip{background:var(--bg2);border:1px solid var(--border);color:var(--text-dim);font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;cursor:pointer;transition:all var(--t-fast)}
.compte-chip.active{background:var(--gold-light);border-color:var(--gold-border);color:var(--gold)}
.modal-search-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--text);outline:none;margin-bottom:8px;transition:border-color var(--t-fast)}
.modal-search-input:focus{border-color:var(--gold)}
.search-btn{width:100%;background:var(--gold);color:#fff;border:none;border-radius:8px;padding:10px;font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;letter-spacing:1.5px;cursor:pointer;transition:opacity var(--t-fast)}
.search-btn:hover{opacity:0.88}
.modal-results{max-height:200px;overflow-y:auto;margin-top:8px}
.modal-result-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;transition:background var(--t-fast)}
.modal-result-row:hover{background:var(--bg2)}
.modal-result-ico{width:32px;height:32px;object-fit:contain;border-radius:6px;background:var(--bg2)}
.modal-result-name{font-size:12px;font-weight:700;color:var(--text);flex:1}
.modal-result-type{font-size:10px;color:var(--text-dim)}
.modal-footer{display:flex;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.modal-btn{flex:1;padding:11px;border-radius:10px;font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;letter-spacing:1.5px;cursor:pointer;border:none;transition:opacity var(--t-fast)}
.modal-btn:hover{opacity:0.88}
.modal-btn.cancel{background:var(--bg2);color:var(--text-dim)}
.modal-btn.save{background:var(--gold);color:#fff}
.modal-btn.danger{background:var(--red);color:#fff}
.exo-add-section{background:var(--bg2);border-radius:10px;padding:10px;margin-bottom:10px}
.exo-select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px;font-size:12px;color:var(--text);margin-bottom:8px}
.exo-val-row{display:flex;gap:6px}
.exo-val-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px;font-size:13px;color:var(--text)}
.exo-confirm-btn{background:var(--gold);color:#fff;border:none;border-radius:6px;padding:7px 14px;font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;cursor:pointer}

/* ── Helpers ── */
.empty-state{text-align:center;padding:32px 20px;color:var(--text-dim);font-size:13px;background:var(--bg2);border-radius:var(--radius)}
.loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:20px;color:var(--text-dim);font-size:13px}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.6s linear infinite}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:rgba(15,8,32,0.97);color:#fff;font-size:13px;font-weight:700;padding:10px 20px;border-radius:24px;z-index:300;pointer-events:none;opacity:0;transition:opacity 0.3s;white-space:nowrap;border:1px solid var(--gold-border);box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.toast.show{opacity:1}
.section-label{font-size:9px;color:var(--text-dim);font-weight:700;letter-spacing:3px;text-transform:uppercase;padding:12px 12px 4px}

/* ── TRACKING ── */
.tracking-section{padding:12px}
.tracking-block{background:var(--surface-glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow-card)}
.tracking-block-title{font-family:'Cinzel',serif;font-size:11px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.tracking-block-title img{width:20px;height:20px;object-fit:contain}
.kamas-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.kamas-total-row{display:flex;justify-content:center;margin-bottom:10px}
.kamas-card{background:var(--bg2);border-radius:10px;padding:10px 12px;text-align:center}
.kamas-card.total{background:var(--gold-light);border:1px solid var(--gold-border);min-width:180px}
.kamas-card-lbl{font-size:9px;color:var(--text-dim);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.kamas-card.total .kamas-card-lbl{color:var(--gold)}
.kamas-card-val{font-family:'Cinzel',serif;font-size:16px;font-weight:700;color:var(--gold)}
.kamas-card.total .kamas-card-val{font-size:20px}
.kamas-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;font-weight:700;color:var(--gold);font-family:'Cinzel',serif;text-align:center;outline:none;transition:border-color var(--t-fast)}
.kamas-input:focus{border-color:var(--gold)}
.tracking-check{width:26px;height:26px;box-sizing:border-box;border-radius:6px;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--t-fast);flex-shrink:0;background:var(--surface);margin:0 auto}
.tracking-check.state1{background:#f0a500;border-color:#f0a500;color:#fff}
.tracking-check.state2{background:var(--green);border-color:var(--green);color:#fff}
.tracking-check.state3{background:var(--red);border-color:var(--red);color:#fff}

/* Tableau ACTIVITÉS — même pattern que le tableau Dofus (sticky + scroll horizontal) */
.tracking-wrap{overflow:auto;max-height:calc(100vh - 140px);-webkit-overflow-scrolling:touch;border-radius:var(--radius);scrollbar-width:thin;scrollbar-color:var(--gold-glow) transparent}
.tracking-wrap::-webkit-scrollbar{width:9px;height:9px}
.tracking-wrap::-webkit-scrollbar-track{background:var(--bg2);border-radius:8px}
.tracking-wrap::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:8px;border:2px solid var(--bg2);background-clip:padding-box}
.tracking-wrap::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--gold-glow),var(--gold2));background-clip:padding-box}
.tracking-wrap::-webkit-scrollbar-corner{background:transparent}
.tracking-table{border-collapse:separate;border-spacing:0;min-width:100%;font-size:11px}
.tracking-table th,.tracking-table td{white-space:nowrap}
.tracking-th-name{position:sticky;left:0;top:0;z-index:11;background:var(--bg2);font-family:'Cinzel',serif;font-size:9px;font-weight:700;color:var(--gold);letter-spacing:2px;text-transform:uppercase;padding:8px 10px;border-right:2px solid var(--gold-border);border-bottom:1px solid var(--border);min-width:120px}
.tracking-th-col{position:sticky;top:0;z-index:10;padding:6px 3px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);text-align:center;background:var(--bg2);width:52px;max-width:52px;vertical-align:middle}
.tracking-th-col img{width:38px;height:38px;object-fit:contain;display:block;margin:2px auto;border-radius:4px}
.tracking-tr-compte td{background:var(--bg3);font-family:'Cinzel',serif;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:2px;text-transform:uppercase;padding:5px 10px;border-top:2px solid var(--gold-border)}
.tracking-td-name{position:sticky;left:0;z-index:2;background:var(--surface);border-right:2px solid var(--gold-border);border-bottom:1px solid var(--border);padding:5px 8px;min-width:120px}
.tracking-td-name-inner{display:flex;align-items:center;gap:6px}
.tracking-td-ico{width:18px;height:18px;object-fit:contain;flex-shrink:0;border-radius:3px}
.tracking-td-pname{font-size:11px;font-weight:700;color:var(--text);letter-spacing:0.2px}
.tracking-td-cell{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:3px;text-align:center;width:58px;max-width:58px;background:var(--surface)}
.tracking-tr-perso:hover .tracking-td-name{background:var(--bg2)}
.tracking-tr-perso:hover .tracking-td-cell{background:var(--bg2)}

/* ── JETONS ── */
.jetons-th-col{width:78px;max-width:78px}
.jetons-td-cell{width:78px;max-width:78px;padding:3px}
.jetons-input{width:100%;height:26px;box-sizing:border-box;background:var(--bg2);border:1.5px solid var(--border);border-radius:6px;padding:0 2px;font-size:12px;font-weight:700;color:var(--text);text-align:center;font-family:'Cinzel',serif;outline:none;transition:border-color var(--t-fast)}
.jetons-input:focus{border-color:var(--gold)}
.jetons-tr-total td{background:var(--gold-light);font-size:12px}
.jetons-tr-total td:first-child{background:var(--bg3)}
.jetons-tr-total .jetons-td-total{text-align:center;font-family:'Cinzel',serif;font-weight:800;color:var(--gold);font-size:12px;letter-spacing:0.3px}

/* ── DOFUS TRACKER ── */
.dofus-section{padding:12px}
.dofus-legend{display:flex;align-items:center;gap:12px;padding:8px 12px;margin-bottom:10px;background:var(--surface-glass);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.dofus-legend-item{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--text-dim);letter-spacing:0.5px;text-transform:uppercase}
.dofus-legend-dot{width:14px;height:14px;border-radius:4px;flex-shrink:0;border:2px solid var(--border)}
.dofus-legend-dot.empty{background:var(--surface)}
.dofus-legend-dot.encours{background:#f0a500;border-color:#f0a500}
.dofus-legend-dot.valide{background:var(--green);border-color:var(--green)}
.dofus-wrap{overflow:auto;max-height:calc(100vh - 140px);-webkit-overflow-scrolling:touch;border-radius:var(--radius);scrollbar-width:thin;scrollbar-color:var(--gold-glow) transparent}
.dofus-wrap::-webkit-scrollbar{width:9px;height:9px}
.dofus-wrap::-webkit-scrollbar-track{background:var(--bg2);border-radius:8px}
.dofus-wrap::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:8px;border:2px solid var(--bg2);background-clip:padding-box}
.dofus-wrap::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--gold-glow),var(--gold2));background-clip:padding-box}
.dofus-wrap::-webkit-scrollbar-corner{background:transparent}
.dofus-table{border-collapse:separate;border-spacing:0;min-width:100%;font-size:11px}
.dofus-table th,.dofus-table td{white-space:nowrap}
.dofus-th-name{position:sticky;left:0;top:0;z-index:11;background:var(--bg2);font-family:'Cinzel',serif;font-size:9px;font-weight:700;color:var(--gold);letter-spacing:2px;text-transform:uppercase;padding:8px 10px;border-right:2px solid var(--gold-border);border-bottom:1px solid var(--border);min-width:120px}
.dofus-th-dofus{position:sticky;top:0;z-index:10;padding:3px 2px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);text-align:center;background:var(--bg2);width:50px;max-width:50px;vertical-align:middle}
.dofus-th-dofus img{width:38px;height:38px;object-fit:contain;display:block;margin:3px auto;border-radius:4px}
.dofus-th-dofus.special-col img{opacity:0.5}
.dofus-tr-compte td{background:var(--bg3);font-family:'Cinzel',serif;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:2px;text-transform:uppercase;padding:5px 10px;border-top:2px solid var(--gold-border)}
.dofus-td-name{position:sticky;left:0;z-index:2;background:var(--surface);border-right:2px solid var(--gold-border);border-bottom:1px solid var(--border);padding:5px 8px;min-width:120px}
.dofus-td-name-inner{display:flex;align-items:center;gap:6px}
.dofus-td-ico{width:18px;height:18px;object-fit:contain;flex-shrink:0}
.dofus-td-pname{font-size:11px;font-weight:700;color:var(--text);letter-spacing:0.2px}
.dofus-td-cell{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:3px;text-align:center;width:34px;max-width:34px;background:var(--surface)}
.dofus-cell{width:26px;height:26px;border-radius:6px;border:2px solid var(--border);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;transition:all var(--t-fast);background:transparent;color:transparent;user-select:none;-webkit-user-select:none}
.dofus-cell:active{transform:scale(0.88)}
.dofus-cell.encours{background:#f0a500;border-color:#f0a500;color:#fff}
.dofus-cell.valide{background:var(--green);border-color:var(--green);color:#fff}
.dofus-td-cell.special-col .dofus-cell{opacity:0.55}
.dofus-tr-perso:hover .dofus-td-name{background:var(--bg2)}
.dofus-tr-perso:hover .dofus-td-cell{background:var(--bg2)}

/* ── AUTH BUTTON ── */
.auth-btn{background:none;border:1px solid var(--gold-border);border-radius:20px;color:var(--text-dim);font-size:12px;font-weight:700;cursor:pointer;padding:3px 10px;margin-right:6px;transition:all var(--t-fast);font-family:'Rajdhani',sans-serif;letter-spacing:0.5px;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.auth-btn:hover{background:var(--gold-light);border-color:var(--gold);color:var(--gold)}
.auth-btn.connected{color:var(--green);border-color:rgba(46,204,113,0.35)}
.auth-btn.connected:hover{background:rgba(46,204,113,0.08)}

/* ── SYNC INDICATOR ── */
.sync-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;flex-shrink:0}
.sync-dot.ok{background:var(--green)}
.sync-dot.syncing{background:var(--yellow);animation:spin 1s linear infinite}
.sync-dot.offline{background:var(--text-dim)}

/* Filtres banque */
.bank-filter{background:var(--bg2);border:1px solid var(--border);color:var(--text-dim);font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;transition:all var(--t-fast)}
.bank-filter.active{background:var(--gold);border-color:var(--gold);color:#fff}
.bank-filter:hover{border-color:var(--gold);color:var(--gold)}
/* ══════════════════════════════════════════
   BUILD PAGE — Design type Dofusbook
   ══════════════════════════════════════════ */
.build-page{padding:14px;display:flex;flex-direction:column;gap:14px;max-width:480px;margin:0 auto}
@media(min-width:768px){.build-page{max-width:600px}}

.build-hdr{background:linear-gradient(135deg, var(--gold) 0%, var(--gold-glow) 100%);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:10px;color:#fff;box-shadow:0 4px 16px rgba(124,92,191,0.18)}
.build-hdr-name{flex:1;background:rgba(255,255,255,0.18);border-radius:10px;padding:10px 14px;font-family:'Cinzel',serif;font-size:14px;font-weight:700;letter-spacing:1px}
.build-hdr-lvl{background:rgba(255,255,255,0.22);border-radius:10px;padding:10px 16px;font-family:'Cinzel',serif;font-size:15px;font-weight:700;min-width:60px;text-align:center}

.bpage-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(124,92,191,0.06);margin-bottom:12px}
[data-theme="dark"] .bpage-card{background:var(--surface);border-color:var(--border)}
.build-card-title{font-family:'Cinzel',serif;font-size:11px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}

.build-section-title{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.build-section-title span:not(.sec-line){flex-shrink:0}
.sec-line{flex:1;height:1px;background:var(--gold-light)}

.build-tabs{display:flex;background:var(--surface);border-radius:12px;padding:4px;border:1px solid var(--border);gap:4px;box-shadow:0 2px 8px rgba(124,92,191,0.05)}
.build-tab{flex:1;border:none;border-radius:9px;padding:9px 0;font-size:13px;font-weight:700;cursor:pointer;background:transparent;color:var(--text-dim);font-family:'Rajdhani',sans-serif;letter-spacing:0.5px;transition:all 0.2s}
.build-tab.active{background:var(--gold);color:#fff;box-shadow:0 2px 6px rgba(124,92,191,0.3)}
.build-tab:hover:not(.active){color:var(--gold);background:var(--gold-light)}

/* Stats items */
.stat-pair-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.stat-item{display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:10px;padding:7px 10px}
.stat-item-ico{display:flex;align-items:center;justify-content:center;width:18px;flex-shrink:0}
.stat-item-ico img{width:16px;height:16px;object-fit:contain}
.stat-item-val{font-family:'Cinzel',serif;font-weight:800;font-size:14px;color:var(--text);min-width:40px;font-variant-numeric:tabular-nums}
.stat-item-val.neg{color:var(--red)}
.stat-item-lbl{font-size:12px;color:var(--text-dim);flex:1}
.stat-bonus{font-size:10px;font-weight:700;border-radius:6px;padding:2px 6px;line-height:1}
.stat-bonus.plus{background:var(--gold);color:#fff}
.stat-bonus.zero{background:var(--gold-light);color:var(--text-dim)}

.stat-grid{display:flex;flex-direction:column;gap:0}

/* Caractéristiques avec base/parcho */
.carac-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--gold-light)}
.carac-row:last-child{border-bottom:none}
.carac-ico{display:flex;align-items:center;justify-content:center;width:18px}
.carac-ico img{width:14px;height:14px;object-fit:contain}
.carac-val{font-family:'Cinzel',serif;font-weight:800;font-size:14px;color:var(--text);min-width:50px;font-variant-numeric:tabular-nums}
.carac-lbl{font-size:13px;color:var(--text-dim);flex:1}
.carac-input{width:44px;text-align:center;border:1.5px solid var(--border);border-radius:8px;padding:4px 0;font-size:13px;background:var(--bg2);font-weight:700;outline:none;font-family:'Rajdhani',sans-serif;color:var(--text-dim)}
.carac-input.base{color:var(--gold)}
.carac-input.parcho{color:var(--green)}
.carac-input:focus{border-color:var(--gold)}
.carac-hdr-lbl{font-size:11px;font-weight:700;color:var(--text-dim);width:44px;text-align:center;letter-spacing:1px;text-transform:uppercase}

/* Exos chips */
.exo-chip{display:inline-flex;align-items:center;gap:5px;background:var(--gold-light);border:1px solid var(--gold-border);border-radius:10px;padding:5px 10px}
.exo-chip img{width:14px;height:14px;object-fit:contain}
.exo-val{font-family:'Cinzel',serif;font-weight:800;font-size:13px;color:var(--gold)}
.exo-lbl{font-size:11px;color:var(--text-dim)}

/* Notes textarea */
.build-notes{width:100%;min-height:80px;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text);font-family:inherit;resize:vertical;outline:none;box-sizing:border-box}
.build-notes:focus{border-color:var(--gold)}
.build-notes-count{text-align:right;font-size:11px;color:var(--text-dim);margin-top:4px}

/* Panoplie cards */
.panoplie-card{display:flex;flex-direction:column;gap:12px}
.panoplie-hdr{display:flex;align-items:baseline;gap:10px}
.panoplie-name{font-family:'Cinzel',serif;font-weight:700;font-size:14px;color:var(--text);flex-shrink:0}
.panoplie-arrow{font-size:12px;color:var(--gold)}
.panoplie-meta{font-size:11px;color:var(--text-dim);margin-left:auto}
.panoplie-items{display:flex;gap:10px;flex-wrap:wrap}
.panoplie-item{display:flex;flex-direction:column;align-items:center;gap:5px}
.panoplie-item-img{width:56px;height:56px;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.panoplie-item-img img{width:46px;height:46px;object-fit:contain}
.panoplie-item-lbl{font-size:10px;color:var(--text-dim);text-align:center}
.panoplie-bonus-hdr{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim)}
.panoplie-bonus-count{background:var(--gold);color:#fff;border-radius:8px;padding:2px 10px;font-size:12px;font-weight:800}
.panoplie-bonus-list{display:flex;flex-direction:column;gap:6px}
.panoplie-bonus-item{font-size:13px;color:var(--text);display:flex;align-items:center;gap:8px;text-align:left}
.panoplie-bonus-item .dot{width:5px;height:5px;border-radius:50%;background:var(--gold2);flex-shrink:0}

/* FM row */
.fm-row{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:10px;padding:10px 14px}
.fm-row img{width:18px;height:18px;object-fit:contain}
.fm-val{font-family:'Cinzel',serif;font-weight:800;font-size:16px;color:var(--gold);min-width:40px}
.fm-lbl{font-size:13px;color:var(--text);flex:1}

/* ══ GRILLE ÉQUIPEMENTS 4 colonnes ══ */
.eq-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;overflow:visible}
.eq-slot4{position:relative;aspect-ratio:1;background:var(--bg2);border:1.5px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color 0.2s,transform 0.15s}
.eq-slot4:hover{border-color:var(--gold);transform:scale(1.04)}
.eq-slot4.active{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-light)}
.eq-slot4.filled{background:var(--surface)}
.eq-slot4-empty{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:18px;line-height:1.2}
.eq-slot4-lbl{font-size:8px;color:var(--text-dim);font-weight:700;letter-spacing:0.5px;text-transform:uppercase;text-align:center}
.eq-slot4-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--surface);z-index:2}
.eq-slot4-tooltip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);min-width:140px;max-width:200px;background:rgba(20,15,35,0.97);backdrop-filter:blur(8px);border:1px solid var(--gold-border);padding:8px 10px;border-radius:10px;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,0.4);pointer-events:none}
.eq-slot4:hover .eq-slot4-tooltip{display:block}
.eq-slot4-tooltip-name{font-size:11px;color:#fff;font-weight:700;white-space:normal;line-height:1.3;margin-bottom:3px}
.eq-slot4-tooltip-src{font-size:10px;margin-top:2px}
.eq-slot4-clear{position:absolute;top:4px;left:4px;background:rgba(224,92,110,0.85);border:none;border-radius:5px;color:#fff;font-size:10px;cursor:pointer;padding:1px 5px;display:none;z-index:3;pointer-events:all}
.eq-slot4:hover .eq-slot4-clear{display:block}
</style>

</head>
<body>

<!-- HEADER -->
<div class="hdr" id="hdr">
  <div style="flex:1;display:flex;align-items:baseline;gap:8px;min-width:0">
    <div class="hdr-title large" id="hdrTitle">IRON STUFFER</div>
    <div class="hdr-sub hidden" id="hdrSub"></div>
  </div>
  <button class="edit-mode-btn hidden" id="editModeBtn" onclick="toggleEditMode()">✏️ Modifier</button>
  <button class="auth-btn" id="authBtn" onclick="handleAuth()">⏳</button>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- VUE TRACKING -->
  <div class="view active" id="view-tracking"></div>

  <!-- VUE JETONS -->
  <div class="view" id="view-jetons"></div>

  <!-- VUE DOFUS -->
  <div class="view" id="view-dofus"></div>

  <!-- VUE BANQUE -->
  <div class="view" id="view-bank"></div>

  <!-- VUE KAMAS -->
  <div class="view" id="view-kamas"></div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="bnav-inner" id="bnavInner">
    <div class="bnav-pill" id="bnavPill"></div>
    <button class="bnav-btn active" id="nav-tracking" onclick="showView('tracking')">
      <span class="ico" id="ico-tracking"><img src="https://api.dofusdb.fr/img/items/20003.png" style="width:24px;height:24px;object-fit:contain"></span>
      Tracking
    </button>
    <button class="bnav-btn" id="nav-jetons" onclick="showView('jetons')">
      <span class="ico" id="ico-jetons"><img src="https://api.dofusdb.fr/img/items/136080.png" style="width:24px;height:24px;object-fit:contain"></span>
      Jetons
    </button>
    <button class="bnav-btn" id="nav-dofus" onclick="showView('dofus')">
      <span class="ico" id="ico-dofus"><img src="https://api.dofusdb.fr/img/items/23004.png" style="width:24px;height:24px;object-fit:contain"></span>
      Dofus
    </button>
    <button class="bnav-btn" id="nav-bank" onclick="showView('bank')">
      <span class="ico" id="ico-bank"><img src="https://api.dofusdb.fr/img/items/172009.png" style="width:24px;height:24px;object-fit:contain"></span>
      Banque
    </button>
    <button class="bnav-btn" id="nav-kamas" onclick="showView('kamas')">
      <span class="ico" id="ico-kamas"><img src="https://api.dofusdu.de/dofus3/v1/img/item/81066-64.png" style="width:24px;height:24px;object-fit:contain"></span>
      Kamas
    </button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MODAL BANQUE -->
<div class="modal-overlay" id="modalBank" onclick="if(event.target===this)closeModal('modalBank')">
  <div class="modal">
    <div class="modal-title">
      <span id="modalBankTitle">Ajouter un item</span>
      <button class="modal-close" onclick="closeModal('modalBank')">✕</button>
    </div>

    <!-- Section recherche -->
    <div id="modalSearchSection">
      <div class="modal-section-title">Rechercher dans le jeu</div>
      <input class="modal-search-input" id="modalSearchInput" placeholder="Nom de l'item..." onkeydown="if(event.key==='Enter')modalSearch()">
      <button class="search-btn" onclick="modalSearch()">🔍 Rechercher</button>
      <div class="modal-results" id="modalSearchResults"></div>
    </div>

    <!-- Section item sélectionné -->
    <div id="modalItemSection" style="display:none">
      <div class="modal-item-preview">
        <img id="modalItemIco" src="" style="width:40px;height:40px;object-fit:contain;border-radius:6px;background:var(--bg2)" onerror="this.style.display='none'">
        <div>
          <div class="modal-item-preview-name" id="modalItemName"></div>
          <div class="modal-item-preview-type" id="modalItemType"></div>
        </div>
        <button onclick="resetModalItem()" style="margin-left:auto;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:18px">✕</button>
      </div>

      <!-- Exos -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div class="modal-section-title" style="margin:0">Forgemagies (exos)</div>
        <button onclick="toggleAddExo()" style="background:var(--gold-light);border:1px solid var(--gold-border);color:var(--gold);font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;cursor:pointer">⚡ Ajouter</button>
      </div>
      <div id="exoAddSection" style="display:none">
        <div class="exo-add-section">
          <select class="exo-select" id="exoStatSelect"></select>
          <div class="exo-val-row">

function loadState(){
  try{
    var s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
    state.bank=s.bank||[];
    state.tracking=s.tracking||{};
    state.dofusTracker=s.dofusTracker||{};
    state.jetons=s.jetons||{};
  }catch(e){}
  cleanupLegacyItemFields();
}

// Nettoyage définitif des anciens champs stats/panoplie/conditions (obsolètes depuis la suppression des builds)
function cleanupLegacyItemFields(){
  var changed=false;
  (state.bank||[]).forEach(function(item){
    ['stats','statMaxima','setId','setName','setBonuses','conditions','nativeKeys'].forEach(function(k){
      if(item[k]!==undefined){ delete item[k]; changed=true; }
    });
  });
  if(changed) saveState();
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  // Sync Firestore si connecté
  if(window._fbUser && window._fsDb){
    var uid=window._fbUser.uid;
    window._syncPending=true;
    updateSyncDot('syncing');
    clearTimeout(window._syncTimer);
    window._syncTimer=setTimeout(function(){
      window._fsDb.collection('users').doc(uid).collection('data').doc('state').set({
        bank: state.bank,
        tracking: state.tracking||{},
        dofusTracker: state.dofusTracker||{},
        jetons: state.jetons||{},
        updatedAt: new Date().toISOString()
      }).then(function(){
        window._syncPending=false;
        updateSyncDot('ok');
      }).catch(function(e){
        console.warn('Firestore save error', e);
        updateSyncDot('offline');
      });
    }, 800); // debounce 800ms pour éviter trop d'écritures
  }
}
function persoById(pid){
  for(var i=0;i<COMPTES.length;i++){
    for(var j=0;j<COMPTES[i].persos.length;j++){

}

}

function updateNavPill(){
  var inner=document.getElementById('bnavInner');
  var activeBtn=inner&&inner.querySelector('.bnav-btn.active');
  var pill=document.getElementById('bnavPill');
  if(!activeBtn||!pill||!inner) return;
  var innerRect=inner.getBoundingClientRect();
  var btnRect=activeBtn.getBoundingClientRect();
  pill.style.left=(btnRect.left-innerRect.left+btnRect.width*0.2)+'px';
  pill.style.width=(btnRect.width*0.6)+'px';
}

function showView(v){
  document.querySelectorAll('.view').forEach(function(el){el.classList.remove('active');});
  document.getElementById('view-'+v).classList.add('active');
  nav.view=v;
  // Nav buttons
  document.querySelectorAll('.bnav-btn').forEach(function(b){b.classList.remove('active');});
  if(v==='bank'){
    document.getElementById('nav-bank').classList.add('active');
  } else if(v==='tracking'){
    document.getElementById('nav-tracking').classList.add('active');
  } else if(v==='jetons'){
    document.getElementById('nav-jetons').classList.add('active');
  } else if(v==='dofus'){
    document.getElementById('nav-dofus').classList.add('active');
  } else if(v==='kamas'){
    document.getElementById('nav-kamas').classList.add('active');
  }
  updateNavPill();
  // Header
  var title = document.getElementById('hdrTitle');
  var sub = document.getElementById('hdrSub');
  if(v==='bank'){
    title.textContent='MA BANQUE';
    title.classList.add('large');
    sub.textContent='';
    sub.classList.add('hidden');
  } else if(v==='tracking'){
    title.textContent='TRACKING';
    title.classList.add('large');
    sub.textContent='';
    sub.classList.add('hidden');
    renderTracking();
  } else if(v==='jetons'){
    title.textContent='JETONS';
    title.classList.add('large');
    sub.classList.remove('hidden');
    renderJetonsTab();
    updateJetonsHeaderDate();
  } else if(v==='dofus'){
    title.textContent='DOFUS';
    title.classList.add('large');
    sub.textContent='';
    sub.classList.add('hidden');
    renderDofusTab();
  } else if(v==='kamas'){
    title.textContent='KAMAS';
    title.classList.add('large');
    sub.textContent='';
    sub.classList.add('hidden');
    renderKamasTab();
  }
  // Bouton Modifier/Enregistrer — visible sur Tracking/Jetons/Dofus/Kamas, toujours réinitialisé en lecture seule au changement d'onglet
  editMode=false;
  var editBtn=document.getElementById('editModeBtn');
  var EDIT_MODE_VIEWS=['tracking','jetons','dofus','kamas'];
  if(EDIT_MODE_VIEWS.indexOf(v)>=0){
    editBtn.classList.remove('hidden');
    editBtn.classList.remove('editing');
    editBtn.textContent='✏️ Modifier';
  } else {
    editBtn.classList.add('hidden');
  }
  var viewEl=document.getElementById('view-'+v);
  if(viewEl) viewEl.classList.add('view-locked');
}

var editMode=false;
function toggleEditMode(){
  editMode=!editMode;
  var editBtn=document.getElementById('editModeBtn');
  var viewEl=document.getElementById('view-'+nav.view);
  if(editMode){
    editBtn.classList.add('editing');
    editBtn.textContent='💾 Enregistrer';
    if(viewEl) viewEl.classList.remove('view-locked');
  } else {
    editBtn.classList.remove('editing');
    editBtn.textContent='✏️ Modifier';
    if(viewEl) viewEl.classList.add('view-locked');
    showToast('Modifications enregistrées');
  }
}

var BANK_FILTER_TYPES=[
  {id:'noexo',   lbl:'Sans exo(s)',  group:'statut'},
  {id:'Chapeau', lbl:'Coiffe',       group:'type'},
  {id:'Amulette',lbl:'Amulette',     group:'type'},
  {id:'Cape',    lbl:'Cape',         group:'type'},
  {id:'Anneau',  lbl:'Anneau',       group:'type'},
  {id:'Ceinture',lbl:'Ceinture',     group:'type'},
  {id:'Bottes',  lbl:'Bottes',       group:'type'},
  {id:'Arme',    lbl:'Arme',         group:'type'},
  {id:'Bouclier',lbl:'Bouclier',     group:'type'},
  {id:'Familier',lbl:'Familier/Monture',group:'type'},
  {id:'Dofus',   lbl:'Dofus',        group:'type'},
  {id:'Trophée', lbl:'Trophée',      group:'type'},
  {id:'Prysmaradite',lbl:'Prysmaradite',group:'type'},
];

// Types d'items qui ne peuvent jamais avoir d'exo
var NO_EXO_TYPES = ['Familier','Dragodinde','Montilier','Muldo','Volkorne','Dofus','Trophée','Prysmaradite'];

function toggleBankFilter(fid){
  var idx=nav.bankFilters.indexOf(fid);
  if(idx>=0) nav.bankFilters.splice(idx,1);
  else nav.bankFilters.push(fid);
  renderBank();
}

var bankSearch = '';
var bankSort = ''; // '' = tous | 'c1'|'c2' etc = filtre par compte

function setBankSearch(val){
  bankSearch = val.toLowerCase().trim();
  applyBankFiltersOnly();
}

function clearBankSearch(){
  bankSearch = '';
  var inp=document.getElementById('bankSearchInput');
  if(inp) inp.value='';
  applyBankFiltersOnly();
}

// Filtre sans reconstruire le header — préserve le focus de l'input
function applyBankFiltersOnly(){
  var list=document.getElementById('bankItemList');
  var empty=document.getElementById('bankEmptyState');
  var counter=document.getElementById('bankCounter');
  if(!list){ renderBank(); return; }

  var visibleCount=0;
  var wrappers=list.querySelectorAll('[data-bank-idx]');
  wrappers.forEach(function(wrapper){
    var idx=parseInt(wrapper.getAttribute('data-bank-idx'));
    var item=state.bank[idx];
    if(item && bankItemMatchesFilters(item,idx)){
      wrapper.style.display='';
      visibleCount++;
    } else {
      wrapper.style.display='none';
    }
  });

  if(counter) counter.textContent=visibleCount+'/'+state.bank.length+' items';
  if(empty){
    if(visibleCount===0 && state.bank.length>0){
      empty.style.display='';
      empty.textContent='Aucun item ne correspond'+(bankSearch?' à "'+bankSearch+'"':' aux filtres');
    } else {
      empty.style.display='none';
    }
  }
  // Mettre à jour le bouton reset
  var resetBtn=document.getElementById('bankResetBtn');
  if(resetBtn) resetBtn.style.display=(nav.bankFilters.length||bankSearch||bankSort)?'inline-block':'none';
}

function setBankSort(val){
  bankSort = bankSort===val ? '' : val;
  // Le tri par compte = filtre, pas juste un réordonnancement
  renderBank();
}

function bankItemMatchesFilters(item, idx){
  // Filtre tri/compte
  if(bankSort && (item.compte||'')!==bankSort) return false;
  // Filtre recherche texte
  if(bankSearch && item.name.toLowerCase().indexOf(bankSearch)<0) return false;
  if(!nav.bankFilters.length) return true;
  var passes=true;
  nav.bankFilters.forEach(function(fid){
    if(fid==='noexo'){
      // Exclure les items qui ne peuvent jamais avoir d'exo
      var t=item.type||'';
      var isExoEligible=!NO_EXO_TYPES.some(function(nt){
        return t.toLowerCase().indexOf(nt.toLowerCase())>-1;
      });
      if(!isExoEligible) passes=false; // item non éligible aux exos → exclu du filtre
      else if(item.exos && Object.keys(item.exos).length>0) passes=false; // a déjà des exos → exclu
    }
    if(fid==='Familier'){
      var t2=item.type||'';
      var famTypes=['Familier','Dragodinde','Montilier','Muldo','Volkorne'];
      if(!famTypes.some(function(ft){return t2.toLowerCase().indexOf(ft.toLowerCase())>-1;})) passes=false;
    } else if(fid==='Arme'){
      var t3=item.type||'';
      if(!WEAPON_TYPES.some(function(wt){return t3.toLowerCase()===wt.toLowerCase();})) passes=false;
    } else if(fid!=='noexo'){
      var t4=item.type||'';
      if(t4.toLowerCase().indexOf(fid.toLowerCase())<0) passes=false;
    }
  });
  return passes;
}

function exportBank(){
  var data=JSON.stringify({bank:state.bank}, null, 2);
  var blob=new Blob([data],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='iron-stuffer-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Export téléchargé !');
}

function importBank(){
  var input=document.createElement('input');
  input.type='file';
  input.accept='.json';
  input.onchange=function(e){
    var file=e.target.files[0];
    if(!file) return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var data=JSON.parse(ev.target.result);
        if(!data.bank) { showToast('Fichier invalide'); return; }
        if(!confirm('Remplacer toute la banque ('+data.bank.length+' items) ? Cette action est irréversible.')) return;
        state.bank=data.bank;
        saveState();
        renderBank();
        showToast('Import réussi — '+data.bank.length+' items chargés !');
      }catch(err){ showToast('Erreur lecture fichier'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ── LAZY LOADING BANQUE ──
var BANK_PAGE_SIZE = 20;
var bankLazyIndices = []; // indices filtrés dans l'ordre d'affichage
var bankLazyLoaded = 0;   // combien sont déjà dans le DOM
var bankLazyObserver = null;

function buildBankIndices(){
  // Indices dans l'ordre inverse (plus récent en haut), filtrés
  var indices = [];
  for(var i=state.bank.length-1; i>=0; i--){
    if(bankItemMatchesFilters(state.bank[i], i)) indices.push(i);
  }
  return indices;
}

function bankAppendItems(from, count){
  var list = document.getElementById('bankItemList');
  if(!list) return;
  var to = Math.min(from + count, bankLazyIndices.length);
  var frag = document.createDocumentFragment();
  for(var i=from; i<to; i++){
    var idx = bankLazyIndices[i];
    var item = state.bank[idx];
    var wrapper = document.createElement('div');
    wrapper.setAttribute('data-bank-idx', idx);
    wrapper.innerHTML = renderBankCard(item, idx);
    frag.appendChild(wrapper);
  }
  // Retirer le sentinel avant d'ajouter, puis remettre à la fin
  var sentinel = document.getElementById('bankSentinel');
  if(sentinel) sentinel.remove();
  list.appendChild(frag);
  bankLazyLoaded = to;
  // Remettre le sentinel si il reste des items
  if(bankLazyLoaded < bankLazyIndices.length){
    var s = document.createElement('div');
    s.id = 'bankSentinel';
    s.style.cssText = 'height:40px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:12px;padding:8px';
    s.innerHTML = '<div class="spinner"></div>';
    list.appendChild(s);
    if(bankLazyObserver) bankLazyObserver.observe(s);
  }
  // Mettre à jour le counter
  var counter = document.getElementById('bankCounter');
  if(counter) counter.textContent = bankLazyIndices.length+'/'+state.bank.length+' items';
}

function initBankLazy(){
  if(bankLazyObserver) bankLazyObserver.disconnect();
  bankLazyObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting && bankLazyLoaded < bankLazyIndices.length){
        bankAppendItems(bankLazyLoaded, BANK_PAGE_SIZE);
      }
    });
  }, {rootMargin:'200px'});
}

function applyBankFiltersOnly(){
  // Rebuild indices et reset lazy
  bankLazyIndices = buildBankIndices();
  bankLazyLoaded = 0;

  var list = document.getElementById('bankItemList');
  var empty = document.getElementById('bankEmptyState');
  var counter = document.getElementById('bankCounter');
  var resetBtn = document.getElementById('bankResetBtn');

  if(!list){ renderBank(); return; }

  // Vider la liste et relancer le lazy
  list.innerHTML = '';
  if(bankLazyObserver) bankLazyObserver.disconnect();

  if(bankLazyIndices.length === 0 && state.bank.length > 0){
    if(empty){ empty.style.display=''; empty.textContent='Aucun item ne correspond'+(bankSearch?' à "'+bankSearch+'"':' aux filtres'); }
  } else {
    if(empty) empty.style.display='none';
    bankAppendItems(0, BANK_PAGE_SIZE);
  }

  if(counter) counter.textContent = bankLazyIndices.length+'/'+state.bank.length+' items';
  if(resetBtn) resetBtn.style.display=(nav.bankFilters.length||bankSearch||bankSort)?'inline-block':'none';
}

function renderBank(){
  bankLazyIndices = buildBankIndices();
  bankLazyLoaded = 0;
  var hasActiveFilters = nav.bankFilters.length||bankSearch||bankSort;

  var h='<div class="bank-header">';
  h+='<div id="bankCounter" style="font-family:Cinzel,serif;font-size:11px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase">'+bankLazyIndices.length+'/'+state.bank.length+' items</div>';

function renderBankCard(item, idx){
  var h='<div class="bank-card">';
  h+='<div class="bank-card-top">';
  if(item.icon){
    h+='<img class="bank-card-ico" src="'+item.icon+'" onerror="this.style.display=\'none\'">';
  } else {
    h+='<div class="bank-card-ico" style="display:flex;align-items:center;justify-content:center;font-size:18px">⚔️</div>';
  }
  h+='<div class="bank-card-actions">';
  h+='<button data-idx="'+idx+'" onclick="openModalBank(parseInt(this.dataset.idx))" title="Modifier">✏️</button>';
  h+='<button data-idx="'+idx+'" onclick="duplicateFromBank(parseInt(this.dataset.idx))" title="Dupliquer">⧉</button>';
  h+='</div>';
  h+='</div>';
  h+='<div class="bank-card-name">'+item.name+'</div>';
  if(item.type) h+='<div class="bank-card-type">'+item.type+'</div>';
  var exos=item.exos||{};
  if(Object.keys(exos).length){
    h+='<div class="bank-card-exos">';
    Object.keys(exos).forEach(function(k){
      var v=parseInt(exos[k])||0;
      if(!v) return;
      h+='<span class="stat-chip exo">⚡ '+(v>0?'+':'')+v+' '+k+'</span>';
    });
    h+='</div>';
  }
  var cname=item.compte||'?';
  COMPTES.forEach(function(c){ if(c.id===item.compte) cname=c.name; });
  h+='<div class="bank-card-compte">'+cname+'</div>';
  h+='</div>';
  return h;
}

// ════════════════════════════════════════════════
// MODAL BANQUE
// ════════════════════════════════════════════════
function openModalBank(idx){
  modalBankData={item:null, editIdx:idx, compte:null};
  document.getElementById('modalBankTitle').textContent=idx!==null?'Modifier un item':'Ajouter un item';
  document.getElementById('modalBankDelete').style.display=idx!==null?'block':'none';
  document.getElementById('modalSearchSection').style.display='block';
  document.getElementById('modalItemSection').style.display='none';
  document.getElementById('modalSearchInput').value='';
  document.getElementById('modalSearchResults').innerHTML='';
  document.getElementById('exoAddSection').style.display='none';

  // Remplir select exo
  var sel=document.getElementById('exoStatSelect');
  sel.innerHTML='';
  STATS_LIST.forEach(function(s){
    var opt=document.createElement('option');
    opt.value=s; opt.textContent=s;
    sel.appendChild(opt);
  });

  if(idx!==null){
    var item=state.bank[idx];
    if(item) preloadModalItem(item);
  }

  renderCompteChips();
  document.getElementById('modalBank').classList.add('active');
}

function duplicateFromBank(idx){
  var item=state.bank[idx];
  if(!item) return;
  // Ouvrir la modal comme un NOUVEL item (editIdx=null) pré-rempli avec les exos de l'original
  modalBankData={item:null, editIdx:null, compte:null};
  document.getElementById('modalBankTitle').textContent='Dupliquer : '+item.name;
  document.getElementById('modalBankDelete').style.display='none';
  document.getElementById('modalSearchSection').style.display='block';
  document.getElementById('modalItemSection').style.display='none';
  document.getElementById('modalSearchInput').value='';
  document.getElementById('modalSearchResults').innerHTML='';
  document.getElementById('exoAddSection').style.display='none';
  var sel=document.getElementById('exoStatSelect');
  sel.innerHTML='';
  STATS_LIST.forEach(function(s){
    var opt=document.createElement('option');
    opt.value=s; opt.textContent=s;
    sel.appendChild(opt);
  });
  // Pré-remplir avec les données de l'item source — mais pas le compte (à choisir)
  preloadModalItem(item);
  modalBankData.editIdx=null; // forcer création
  modalBankData.compte=null;  // forcer choix du compte
  renderCompteChips();
  document.getElementById('modalBank').classList.add('active');
  showToast('Choisissez le compte pour la copie');
}

function preloadModalItem(item){
  modalBankData.item={name:item.name,icon:item.icon||'',type:item.type||'',exos:Object.assign({},item.exos||{}),ankama_id:item.ankama_id||null};
  modalBankData.compte=item.compte||null;
  showModalItem(item.name,item.icon||'',item.type||'');
}

function renderCompteChips(){
  var h='';
  COMPTES.forEach(function(c){
    var isActive=modalBankData.compte===c.id;
    h+='<div class="compte-chip '+(isActive?'active':'')+'" data-cid="'+c.id+'" onclick="selectCompte(this)">'+c.name+'</div>';
  });
  document.getElementById('modalCompteChips').innerHTML=h;
}

function selectCompte(el){
  modalBankData.compte=el.getAttribute('data-cid');
  document.querySelectorAll('.compte-chip').forEach(function(x){x.classList.remove('active');});
  el.classList.add('active');
}

function modalSearch(){
  var q=(document.getElementById('modalSearchInput').value||'').trim();
  if(q.length<2){ showToast('Tape au moins 2 lettres'); return; }
  var el=document.getElementById('modalSearchResults');
  el.innerHTML='<div class="loading"><span class="spinner"></span>Recherche...</div>';

  fetch(API+'/items/equipment/search?query='+encodeURIComponent(q)+'&limit=15')
    .then(function(r){return r.json();})
    .then(function(data){
      modalSearchCache=data||[];
      var h='';
      modalSearchCache.slice(0,10).forEach(function(item,idx){
        var ico=item.image_urls&&item.image_urls.icon?item.image_urls.icon:'';
        var type=item.type&&item.type.name?item.type.name:'';
        h+='<div class="modal-result-row" data-midx="'+idx+'" onclick="selectModalItem(parseInt(this.dataset.midx))">';
        if(ico) h+='<img class="modal-result-ico" src="'+ico+'" onerror="this.style.display=\'none\'">';
        else h+='<div class="modal-result-ico" style="display:flex;align-items:center;justify-content:center;font-size:16px">⚔️</div>';
        h+='<div><div class="modal-result-name">'+item.name+'</div><div class="modal-result-type">'+type+'</div></div>';
        h+='</div>';
      });
      el.innerHTML=h||'<div class="empty-state">Aucun résultat</div>';
    })
    .catch(function(){ el.innerHTML='<div class="empty-state">Erreur réseau</div>'; });
}

function resetModalItem(){
  modalBankData.item=null;
  document.getElementById('modalSearchSection').style.display='block';
  document.getElementById('modalItemSection').style.display='none';
  document.getElementById('modalSearchInput').value='';
  document.getElementById('modalSearchResults').innerHTML='';
}

function selectModalItem(idx){
  var item=modalSearchCache[idx];
  if(!item) return;
  var ico=item.image_urls&&item.image_urls.icon?item.image_urls.icon:'';
  var type=item.type&&item.type.name?item.type.name:'';
  modalBankData.item={name:item.name,icon:ico,type:type,exos:{},ankama_id:item.ankama_id||null};
  showModalItem(item.name,ico,type);
}

function showModalItem(name,ico,type){
  document.getElementById('modalSearchSection').style.display='none';
  document.getElementById('modalItemSection').style.display='block';
  document.getElementById('modalItemName').textContent=name;
  document.getElementById('modalItemType').textContent=type;
  if(ico) document.getElementById('modalItemIco').src=ico;
  if(!modalBankData.item.exos) modalBankData.item.exos={};
  renderModalStats();
  renderCompteChips();
}

function renderModalStats(){
  var exos=modalBankData.item.exos||{};
  var h='';

  var exoKeys=Object.keys(exos);
  if(exoKeys.length){
    h+='<div class="stat-edit-grid">';
    exoKeys.forEach(function(k){
      h+='<div class="exo-row">';
      h+='<span class="exo-name">⚡ '+k+'</span>';
      h+='<input class="stat-edit-input" type="number" value="'+exos[k]+'" data-stat="'+k+'" onchange="updateModalStat(this)">';
      h+='<button data-exokey="'+k+'" onclick="removeExo(this.dataset.exokey)" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:13px;padding:0 3px">✕</button>';
      h+='</div>';
    });
    h+='</div>';
  } else {
    h+='<div style="font-size:12px;color:var(--text-dim);padding:8px 0">Aucune forgemagie ajoutée</div>';
  }

  document.getElementById('modalStatGrid').innerHTML=h;
}

function toggleAddExo(){
  var el=document.getElementById('exoAddSection');
  el.style.display=el.style.display==='none'?'block':'none';
}

function confirmAddExo(){
  var k=document.getElementById('exoStatSelect').value;
  var v=parseInt(document.getElementById('exoValInput').value)||0;
  if(!k||!v){ showToast('Stat et valeur requises'); return; }
  if(!modalBankData.item.exos) modalBankData.item.exos={};
  modalBankData.item.exos[k]=v;
  document.getElementById('exoValInput').value='';
  document.getElementById('exoAddSection').style.display='none';
  renderModalStats();
}

function removeExo(k){
  if(modalBankData.item.exos) delete modalBankData.item.exos[k];
  renderModalStats();
}

function updateModalStat(el){
  var k=el.getAttribute('data-stat');
  var v=parseInt(el.value)||0;
  if(!modalBankData.item.exos) modalBankData.item.exos={};
  modalBankData.item.exos[k]=v;
}

function saveBankItem(){
  if(!modalBankData.item){ showToast('Sélectionne un item'); return; }
  if(!modalBankData.compte){ showToast('Choisis un compte'); return; }

  var entry={
    name:modalBankData.item.name,
    icon:modalBankData.item.icon||'',
    type:modalBankData.item.type||'',
    exos:modalBankData.item.exos||{},
    compte:modalBankData.compte,
    ankama_id:modalBankData.item.ankama_id||null
  };

  if(modalBankData.editIdx!==null){
    state.bank[modalBankData.editIdx]=entry;
  } else {
    state.bank.push(entry);
  }
  saveState();
  closeModal('modalBank');
  renderBank();
  showToast(entry.name+(modalBankData.editIdx!==null?' modifié !':' ajouté !'));
}

function deleteBankItem(){
  if(modalBankData.editIdx===null) return;
  if(!confirm('Supprimer cet item ?')) return;
  state.bank.splice(modalBankData.editIdx,1);
  saveState();
  closeModal('modalBank');
  renderBank();
  showToast('Item supprimé');
}

function closeModal(id){
  document.getElementById(id).classList.remove('active');
}

};

window._fbUser = null;
window._fsDb = null;
window._syncPending = false;
window._syncTimer = null;

function initFirebase(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    window._fsDb = firebase.firestore();
    // Persistence offline (cache local si pas de connexion)
    window._fsDb.enablePersistence({synchronizeTabs:true}).catch(function(){});

    firebase.auth().onAuthStateChanged(function(user){
      window._fbUser = user;
      if(user){
        updateAuthBtn(user);
        loadFromFirestore(function(){
          renderBank();
          if(nav.view==='tracking') renderTracking();
          if(nav.view==='jetons') renderJetonsTab();
          if(nav.view==='dofus') renderDofusTab();
          if(nav.view==='kamas') renderKamasTab();
        });
      } else {
        updateAuthBtn(null);
      }
    });
  }catch(e){
    console.warn('Firebase init error', e);
  }
}

function loadFromFirestore(cb){
  if(!window._fbUser || !window._fsDb){ if(cb) cb(); return; }
  updateSyncDot('syncing');
  window._fsDb.collection('users').doc(window._fbUser.uid)
    .collection('data').doc('state').get()
    .then(function(doc){
      if(doc.exists){
        var d=doc.data();
        // Merge : Firestore gagne sur localStorage sauf si localStorage est plus récent
        var localRaw=null;
        try{ localRaw=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); }catch(e){}
        var localUpdated=localRaw&&localRaw.updatedAt?localRaw.updatedAt:'';
        var remoteUpdated=d.updatedAt||'';
        if(remoteUpdated>=localUpdated){
          state.bank=d.bank||[];
          state.tracking=d.tracking||{};
          state.dofusTracker=d.dofusTracker||{};
          state.jetons=d.jetons||{};
          cleanupLegacyItemFields();
          // Mettre aussi à jour le localStorage comme cache
          try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({bank:state.bank, jetons:state.jetons, updatedAt:remoteUpdated})); }catch(e){}
        } else {
          // localStorage plus récent → on upload vers Firestore
          saveState();
        }
      } else {
        // Première connexion : on upload le localStorage existant
        saveState();
      }
      updateSyncDot('ok');
      if(cb) cb();
    }).catch(function(e){
      console.warn('Firestore load error', e);
      updateSyncDot('offline');
      if(cb) cb();
    });
}

function handleAuth(){
  if(window._fbUser){
    // Déjà connecté → proposer déconnexion
    if(confirm('Te déconnecter de la synchro cloud ? Tes données restent en local.')){
      firebase.auth().signOut();
    }
  } else {
    // Connexion Google
    var provider = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(provider).catch(function(e){
      showToast('Connexion annulée');
    });
  }
}

function updateAuthBtn(user){
  var btn=document.getElementById('authBtn');
  if(!btn) return;
  if(user){
    var name=user.displayName?user.displayName.split(' ')[0]:user.email;
    btn.textContent=name;
    btn.className='auth-btn connected';
    btn.title='Connecté — cliquer pour déconnecter';
  } else {
    btn.textContent='☁️ Sync';
    btn.className='auth-btn';
    btn.title='Se connecter pour synchroniser sur tous tes appareils';
  }
}

function updateSyncDot(status){
  // Affiche l'état de sync dans le sous-titre du header si on est connecté
  var sub=document.getElementById('hdrSub');
  if(!sub||nav.view!=='persos') return;
  if(status==='ok'){
    sub.innerHTML='<span class="sync-dot ok"></span>Synchro cloud OK';
  } else if(status==='syncing'){
    sub.innerHTML='<span class="sync-dot syncing"></span>Synchronisation...';
  } else {
    sub.innerHTML='<span class="sync-dot offline"></span>Hors ligne';
  }
}

function getTrackingState(){
  if(!state.tracking) state.tracking={};
  var t=state.tracking;
  if(!t.kamas) t.kamas={};
  if(!t.justicier) t.justicier={};
  if(!t.parcho) t.parcho={};
  if(!t.parangon) t.parangon={};
  if(!t.lastReset) t.lastReset=null;
  checkJusticierReset();
  return t;
}

function checkJusticierReset(){
  var t=state.tracking;
  if(!t) return;
  var now=new Date();
  var lastReset=t.lastReset?new Date(t.lastReset):null;
  var d=new Date(now);
  d.setHours(0,0,0,0);
  while(d.getDay()!==2) d.setDate(d.getDate()-1);
  if(!lastReset||lastReset<d){
    t.justicier={};
    t.lastReset=d.toISOString();
  }
}

function getJetonsState(){
  if(!state.jetons) state.jetons={};
  JETON_COLUMNS.forEach(function(col){
    if(!state.jetons[col.key]) state.jetons[col.key]={};
  });
  return state.jetons;
}

function setJetonValue(el){
  var jkey=el.getAttribute('data-jkey');
  var pid=el.getAttribute('data-pid');
  var v=parseInt(el.value)||0;
  if(v<0) v=0;
  if(v>99999) v=99999;
  var j=getJetonsState();
  j[jkey][pid]=v;
  j._lastUpdated=new Date().toISOString();
  saveState();
  el.value=v||'';
  // Mettre à jour le total du compte pour cette colonne uniquement
  var c=compteOfPerso(pid);
  if(c){
    var total=c.persos.reduce(function(sum,p){ return sum+(j[jkey][p.id]||0); },0);
    var totalEl=document.querySelector('[data-jtotal="'+jkey+'-'+c.id+'"]');
    if(totalEl) totalEl.textContent=total||'';
  }
  updateJetonsHeaderDate();
}

function updateJetonsHeaderDate(){
  var sub=document.getElementById('hdrSub');
  if(!sub||nav.view!=='jetons') return;
  var j=getJetonsState();
  if(j._lastUpdated){
    var d=new Date(j._lastUpdated);
    var dd=String(d.getDate()).padStart(2,'0');
    var mm=String(d.getMonth()+1).padStart(2,'0');
    var yyyy=d.getFullYear();
    sub.textContent='· MAJ le '+dd+'/'+mm+'/'+yyyy;
  } else {
    sub.textContent='';
  }
}

function formatKamas(val){
  if(!val||isNaN(val)) return '0';
  var s=Math.floor(val).toString();var r='';for(var i=0;i<s.length;i++){if(i>0&&(s.length-i)%3===0)r+=' ';r+=s[i];}return r;
}

function parseKamas(str){
  return parseInt((str||'').replace(/[^0-9]/g,''))||0;
}

function setKamas(compteId, val){
  var t=getTrackingState();
  t.kamas[compteId]=Math.min(parseKamas(val),999999999);
  saveState();
  var el=document.getElementById('kamasTotal');
  if(el){
    var total=COMPTES.reduce(function(sum,c){ return sum+(t.kamas[c.id]||0); },0);
    el.textContent=formatKamas(total);
  }
}

function cycleJusticier(pid){
  var t=getTrackingState();
  var cur=t.justicier[pid]||0;
  t.justicier[pid]=(cur+1)%2;
  saveState();
  var btn=document.querySelector('[data-jpid="'+pid+'"]');
  if(btn){
    var v=t.justicier[pid];
    btn.className='tracking-check'+(v===1?' state2':'');
    btn.textContent=v===1?'✓':'';
  }
}

function cycleParcho(pid){
  var t=getTrackingState();
  var cur=t.parcho&&t.parcho[pid]||0;
  if(!t.parcho) t.parcho={};
  t.parcho[pid]=(cur+1)%2;
  saveState();
  var btn=document.querySelector('[data-ppid="'+pid+'"]');
  if(btn){
    var v=t.parcho[pid];
    btn.className='tracking-check'+(v===1?' state2':'');
    btn.textContent=v===1?'✓':'';
  }
}

function cycleParangon(pid){
  var t=getTrackingState();
  var cur=t.parangon&&t.parangon[pid]||0;
  if(!t.parangon) t.parangon={};
  t.parangon[pid]=(cur+1)%4;
  saveState();
  var btn=document.querySelector('[data-parpid="'+pid+'"]');
  if(btn){
    var v=t.parangon[pid];
    btn.className='tracking-check'+(v===1?' state1':v===2?' state2':v===3?' state3':'');
    btn.textContent=v===1?'●':v===2?'✓':v===3?'✕':'';
  }
}

function renderTracking(){
  var t=getTrackingState();

  // Prochain reset mardi (colonne hebdo : Justicier)
  var now=new Date();
  var next=new Date(now);
  next.setHours(0,0,0,0);
  next.setDate(next.getDate()+((2-next.getDay()+7)%7||7));
  var diff=next-now;
  var days=Math.floor(diff/86400000);
  var hours=Math.floor((diff%86400000)/3600000);
  var resetStr='Reset dans '+days+'j '+hours+'h';

  // ── TABLEAU ACTIVITÉS EN PLEINE PAGE (comme Dofus) ──
  var h='<div class="tracking-section">';
  h+='<div class="tracking-wrap">';
  h+='<table class="tracking-table"><thead><tr>';
  h+='<th class="tracking-th-name">Personnage</th>';
  h+='<th class="tracking-th-col" title="Justicier - '+resetStr+'"><img src="'+JUSTICIER_ICO+'" onerror="this.style.opacity=0.2"></th>';
  h+='<th class="tracking-th-col" title="Full Parcho"><img src="'+PARCHO_ICO+'" onerror="this.style.opacity=0.2"></th>';
  h+='<th class="tracking-th-col" title="Parangon"><img src="'+PARANGON_ICO+'" onerror="this.style.opacity=0.2"></th>';
  h+='<th class="tracking-th-col" title="Arme de chasse"><img src="'+CHASSE_ARME_ICO+'" onerror="this.style.opacity=0.2"></th>';
  h+='<th class="tracking-th-col" title="Chasseur 200"><img src="'+CHASSEUR200_ICO+'" onerror="this.style.opacity=0.2"></th>';
  h+='</tr></thead><tbody>';

  COMPTES.forEach(function(c){
    h+='<tr class="tracking-tr-compte"><td class="tracking-td-name">'+c.name+'</td><td colspan="5"></td></tr>';
    c.persos.forEach(function(p){
      var vj=t.justicier[p.id]||0;
      var vp=(t.parcho&&t.parcho[p.id])||0;
      var vpar=(t.parangon&&t.parangon[p.id])||0;
      var vca=(t.armeChasse&&t.armeChasse[p.id])||0;
      var vc200=(t.chasseur200&&t.chasseur200[p.id])||0;

      var jClass='tracking-check'+(vj===1?' state2':'');
      var jIcon=vj===1?'✓':'';

      var pClass='tracking-check'+(vp===1?' state2':'');
      var pIcon=vp===1?'✓':'';

      var parClass='tracking-check'+(vpar===1?' state1':vpar===2?' state2':vpar===3?' state3':'');
      var parIcon=vpar===1?'●':vpar===2?'✓':vpar===3?'✕':'';

      var caClass='tracking-check'+(vca===1?' state2':'');
      var caIcon=vca===1?'✓':'';

      var c200Class='tracking-check'+(vc200===1?' state2':'');
      var c200Icon=vc200===1?'✓':'';

      h+='<tr class="tracking-tr-perso">';
      // Nom + icône classe (colonne fixe)
      h+='<td class="tracking-td-name"><div class="tracking-td-name-inner">';
      if(CLASS_ICONS_STUFFER[p.classe]){
        h+='<img class="tracking-td-ico" src="'+CLASS_ICONS_STUFFER[p.classe]+'" alt="'+p.classe+'">';
      } else {
        h+='<span class="tracking-td-ico" style="font-size:14px;display:flex;align-items:center;justify-content:center">'+getClassEmoji(p.classe)+'</span>';
      }
      h+='<span class="tracking-td-pname">'+p.name+'</span>';
      h+='</div></td>';
      // Justicier
      h+='<td class="tracking-td-cell"><div class="'+jClass+'" data-jpid="'+p.id+'" onclick="cycleJusticier(this.dataset.jpid)">'+jIcon+'</div></td>';
      // Full Parcho
      h+='<td class="tracking-td-cell"><div class="'+pClass+'" data-ppid="'+p.id+'" onclick="cycleParcho(this.dataset.ppid)">'+pIcon+'</div></td>';
      // Parangon
      h+='<td class="tracking-td-cell"><div class="'+parClass+'" data-parpid="'+p.id+'" onclick="cycleParangon(this.dataset.parpid)">'+parIcon+'</div></td>';
      // Arme de chasse
      h+='<td class="tracking-td-cell"><div class="'+caClass+'" data-acpid="'+p.id+'" onclick="cycleArmeChasse(this.dataset.acpid)">'+caIcon+'</div></td>';
      // Chasseur 200
      h+='<td class="tracking-td-cell"><div class="'+c200Class+'" data-c200pid="'+p.id+'" onclick="cycleChasseur200(this.dataset.c200pid)">'+c200Icon+'</div></td>';
      h+='</tr>';
    });
  });

  h+='</tbody></table></div>';
  h+='</div>';

  document.getElementById('view-tracking').innerHTML=h;
}


// ════════════════════════════════════════════════
// DOFUS TRACKER
// ════════════════════════════════════════════════
function getDofusTrackerState(){
  if(!state.dofusTracker) state.dofusTracker={};
  return state.dofusTracker;
}

function cycleArmeChasse(pid){
  var t=getTrackingState();
  if(!t.armeChasse) t.armeChasse={};
  var cur=t.armeChasse[pid]||0;
  t.armeChasse[pid]=(cur+1)%2;
  saveState();
  var btn=document.querySelector('[data-acpid="'+pid+'"]');
  if(btn){
    var v=t.armeChasse[pid];
    btn.className='tracking-check'+(v===1?' state2':'');
    btn.textContent=v===1?'✓':'';
  }
}

function cycleChasseur200(pid){
  var t=getTrackingState();
  if(!t.chasseur200) t.chasseur200={};
  var cur=t.chasseur200[pid]||0;
  t.chasseur200[pid]=(cur+1)%2;
  saveState();
  var btn=document.querySelector('[data-c200pid="'+pid+'"]');
  if(btn){
    var v=t.chasseur200[pid];
    btn.className='tracking-check'+(v===1?' state2':'');
    btn.textContent=v===1?'✓':'';
  }
}

function cycleDofusCell(pid, dofusId){
  var d=getDofusTrackerState();
  var key=pid+'_'+dofusId;
  var cur=d[key]||0;
  d[key]=(cur+1)%3;
  saveState();
  var cell=document.querySelector('[data-dcell="'+key+'"]');
  if(cell){
    var v=d[key];
    cell.className='dofus-cell'+(v===1?' encours':v===2?' valide':'');
    cell.textContent=v===1?'\u25CF':v===2?'\u2713':'';
  }
}

function renderDofusTab(){
  var d=getDofusTrackerState();
  var h='<div class="dofus-section">';
  h+='<div class="dofus-legend">';
  h+='<div class="dofus-legend-item"><div class="dofus-legend-dot empty"></div>Non commencé</div>';
  h+='<div class="dofus-legend-item"><div class="dofus-legend-dot encours"></div>En cours ●</div>';
  h+='<div class="dofus-legend-item"><div class="dofus-legend-dot valide"></div>Validé ✓</div>';
  h+='</div>';
  h+='<div class="dofus-wrap">';
  h+='<table class="dofus-table"><thead><tr>';
  h+='<th class="dofus-th-name">Personnage</th>';
  DOFUS_TRACKER_LIST.forEach(function(df){
    var sc=df.special?' special-col':'';
    var ico=df.icon?'<img src="'+df.icon+'" alt="'+df.name+'" onerror="this.style.opacity=0.2">':'<span>'+df.name+'</span>';
    h+='<th class="dofus-th-dofus'+sc+'" title="'+df.name+'">'+ico+'</th>';
  });
  h+='</tr></thead><tbody>';
  COMPTES.forEach(function(c){
    h+='<tr class="dofus-tr-compte"><td class="dofus-td-name">'+c.name+'</td>';
    DOFUS_TRACKER_LIST.forEach(function(){ h+='<td></td>'; });
    h+='</tr>';
    c.persos.forEach(function(p){
      h+='<tr class="dofus-tr-perso">';
      h+='<td class="dofus-td-name"><div class="dofus-td-name-inner">';
      if(CLASS_ICONS_STUFFER[p.classe]){
        h+='<img class="dofus-td-ico" src="'+CLASS_ICONS_STUFFER[p.classe]+'" alt="'+p.classe+'">';
      } else {
        h+='<span class="dofus-td-ico" style="font-size:14px;display:flex;align-items:center;justify-content:center">'+getClassEmoji(p.classe)+'</span>';
      }
      h+='<span class="dofus-td-pname">'+p.name+'</span>';
      h+='</div></td>';
      DOFUS_TRACKER_LIST.forEach(function(df){
        var key=p.id+'_'+df.id;
        var v=d[key]||0;
        var cls='dofus-cell'+(v===1?' encours':v===2?' valide':'');
        var icon=v===1?'\u25CF':v===2?'\u2713':'';
        var sc=df.special?' special-col':'';
        h+='<td class="dofus-td-cell'+sc+'">';
        h+='<div class="'+cls+'" data-dcell="'+key+'" onclick="cycleDofusCell(\''+p.id+'\',\''+df.id+'\')">'+icon+'</div>';
        h+='</td>';
      });
      h+='</tr>';
    });
  });
  h+='</tbody></table></div></div>';
  document.getElementById('view-dofus').innerHTML=h;
}

// DARK MODE
// ════════════════════════════════════════════════
function applyTheme(dark){
  document.documentElement.setAttribute('data-theme', dark?'dark':'light');
  var btn=document.getElementById('themeToggle');
  if(btn) btn.textContent=dark?'☀️':'🌙';
}

function toggleTheme(){
  var isDark=document.documentElement.getAttribute('data-theme')==='dark';
  var next=!isDark;
  applyTheme(next);
  try{ localStorage.setItem('iron_theme', next?'dark':'light'); }catch(e){}
}

// Appliquer thème sauvegardé
(function(){
  var saved=null;
  try{ saved=localStorage.getItem('iron_theme'); }catch(e){}
  applyTheme(saved==='dark');
})();
