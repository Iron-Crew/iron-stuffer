<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Fus-Iron</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fus-Iron">
<meta name="theme-color" content="#7c5cbf">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Firebase SDK compat -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* ══════════════════════════════════════════
   FUS-IRON — DESIGN SYSTEM « Violet modernisé »
   Light mode (default) + Dark mode toggle
   Tailles fluides : téléphone → laptop → très grand écran
   ══════════════════════════════════════════ */
:root {
  /* Couleurs principales */
  --gold:#7c5cbf; --gold2:#9b7fd4; --gold-text:#5b3ea3; --on-gold:#fff;
  --gold-light:#f3effb; --gold-border:rgba(124,92,191,0.28);
  --ok:#22a861; --ok-bg:#e6f7ee; --ok-text:#178a4e;
  --warn:#e09a12; --warn-bg:#fdf3df;
  --ko:#d9483b; --ko-bg:#fce8e6;

  /* Surfaces */
  --bg:#f7f5fc; --surface:#fff; --surface-blur:rgba(255,255,255,0.85);
  --head:#fff; --compte:#f3effb; --row-hover:#faf8fe;
  --border:rgba(124,92,191,0.16); --border-soft:rgba(124,92,191,0.08);
  --text:#1c1530; --text-dim:#7d7299;
  --chk-bg:#fff; --chk-border:#ddd3f0; --bar-bg:#ece6f8;
  --toast-bg:rgba(28,21,48,0.96);

  /* Formes */
  --radius:10px; --radius-lg:16px;
  --shadow:0 1px 2px rgba(60,30,120,0.05),0 8px 24px rgba(60,30,120,0.06);

  /* Tailles fluides */
  --cell:clamp(36px,2.8vw,74px);
  --name-w:clamp(190px,13vw,290px);
  --side-w:clamp(200px,14vw,260px);

  --t-fast:0.15s ease;
}

/* ── DARK MODE ── */
[data-theme="dark"] {
  --gold:#a87ee8; --gold2:#c4a6f5; --gold-text:#c4a6f5; --on-gold:#140c26;
  --gold-light:#20163a; --gold-border:rgba(168,126,232,0.32);
  --ok:#3ddc84; --ok-bg:rgba(61,220,132,0.13); --ok-text:#5ff09e;
  --warn:#f5b53d; --warn-bg:rgba(245,181,61,0.13);
  --ko:#ff6b5e; --ko-bg:rgba(255,107,94,0.13);
  --bg:#0e0a18; --surface:#171029; --surface-blur:rgba(19,13,34,0.85);
  --head:#1a1230; --compte:#20163a; --row-hover:#1c1432;
  --border:rgba(168,126,232,0.18); --border-soft:rgba(168,126,232,0.08);
  --text:#ede8ff; --text-dim:#9488b5;
  --chk-bg:#120c20; --chk-border:#34275a; --bar-bg:#2a1f48;
  --toast-bg:rgba(237,232,255,0.96);
  --shadow:0 8px 30px rgba(0,0,0,0.35);
}

/* ── BASE ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(14px,0.5vw + 8px,19px)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:background var(--t-fast),color var(--t-fast)}
input,button,select{font-family:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── STRUCTURE : menu à gauche + contenu ── */
.app{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:100vh}

.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:calc(22px + env(safe-area-inset-top)) 14px 22px;background:var(--surface);border-right:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.brand img{width:40px;height:40px;border-radius:10px}
.brand span{font-family:'Cinzel',serif;font-size:1.2rem;font-weight:700;letter-spacing:0.06em;color:var(--gold-text);white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;border-radius:var(--radius);color:var(--text-dim);font-size:1rem;font-weight:600;text-align:left;transition:background var(--t-fast),color var(--t-fast)}
.nav-btn img{width:28px;height:28px;object-fit:contain;flex-shrink:0}
.nav-btn:hover{background:var(--gold-light)}
.nav-btn.active{background:var(--gold);color:var(--on-gold)}

.main{min-width:0;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;padding:calc(clamp(14px,2vw,40px) + env(safe-area-inset-top)) clamp(14px,2vw,40px) clamp(14px,2vw,40px)}
.inner{width:fit-content;max-width:100%;min-height:0;margin:0 auto;display:flex;flex-direction:column;gap:clamp(12px,1.4vw,24px)}

/* ── EN-TÊTE ── */
.hdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hdr-titles{flex:1;min-width:0}
.hdr-title{font-family:'Cinzel',serif;font-size:clamp(1.5rem,2vw,2.4rem);font-weight:700;letter-spacing:0.06em;color:var(--gold-text);line-height:1.1}
.hdr-sub{font-size:0.9rem;color:var(--text-dim);margin-top:4px}
.hdr-actions{display:flex;gap:8px}
.edit-mode-btn,.auth-btn,.theme-toggle{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);font-size:0.9rem;font-weight:600;white-space:nowrap;transition:border-color var(--t-fast),background var(--t-fast)}
.edit-mode-btn:hover,.auth-btn:hover,.theme-toggle:hover{border-color:var(--gold)}
.edit-mode-btn{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.edit-mode-btn:hover{background:var(--gold2);border-color:var(--gold2)}
.edit-mode-btn.editing{background:var(--ok);border-color:var(--ok);color:#fff}
.auth-btn{max-width:170px;overflow:hidden;text-overflow:ellipsis}

/* Point d'état de la synchro cloud (dans le bouton de connexion) */
.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;background:var(--text-dim)}
.sync-dot.ok{background:var(--ok)}
.sync-dot.syncing{background:var(--warn);animation:spin 1s linear infinite}
.sync-dot.offline{background:var(--text-dim)}

/* ── VUES ── */
.view{display:none}
.view.active{display:flex;flex-direction:column;gap:clamp(12px,1.4vw,24px);min-height:0;animation:fadeSlideIn 0.22s ease}

/* Lecture seule (bouton Modifier) : couleurs inchangées, clics bloqués */
.view-locked .tracking-check,
.view-locked .jetons-input,
.view-locked .dofus-cell,
.view-locked .kamas-input{pointer-events:none}

/* ── TABLEAUX (Tracking, Jetons, Dofus) ── */
.tracking-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;max-width:100%;min-height:0;display:flex;flex-direction:column}
.tracking-wrap{overflow:auto;min-height:0;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--gold2) transparent}
.tracking-wrap::-webkit-scrollbar{width:9px;height:9px}
.tracking-wrap::-webkit-scrollbar-track{background:transparent}
.tracking-wrap::-webkit-scrollbar-thumb{background:var(--gold2);border-radius:8px;border:2px solid var(--surface);background-clip:padding-box}
.tracking-wrap::-webkit-scrollbar-corner{background:transparent}

.tracking-table{border-collapse:separate;border-spacing:0}
.tracking-table th,.tracking-table td{white-space:nowrap}
.tracking-table thead th{position:sticky;top:0;z-index:10;background:var(--head);border-bottom:1px solid var(--border);height:calc(var(--cell) + 10px)}
.tracking-th-name{left:0;z-index:12!important;text-align:left;padding:0 16px;font-size:0.75rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-dim);border-right:1px solid var(--border)}
.tracking-th-col{width:var(--cell);min-width:var(--cell);text-align:center}
.tracking-th-col img{width:calc(var(--cell) * 0.66);height:calc(var(--cell) * 0.66);object-fit:contain;display:block;margin:auto}
.tracking-th-prog{padding:0 14px;text-align:left;font-size:0.75rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-dim)}
.tracking-table .sep{border-left:2px solid var(--gold-border)}

/* Ligne d'un compte */
.tracking-tr-compte td{background:var(--compte);border-bottom:1px solid var(--border)}
.tracking-tr-compte .tracking-td-name{background:var(--compte);font-family:'Cinzel',serif;font-size:0.95rem;font-weight:700;letter-spacing:0.06em;color:var(--gold-text)}
/* % du compte : dans la colonne Prog. sur PC, à côté du nom sur téléphone */
.compte-pct{display:none;margin-left:8px;font-family:'Inter',system-ui,sans-serif;font-size:0.75rem;font-weight:600;letter-spacing:0;color:var(--text-dim)}
.tracking-tr-compte .tracking-td-prog{background:var(--compte);border-bottom:1px solid var(--border)}

/* Colonne des noms */
.tracking-td-name{position:sticky;left:0;z-index:2;background:var(--surface);width:var(--name-w);min-width:var(--name-w);max-width:var(--name-w);padding:6px 14px;border-right:1px solid var(--border);border-bottom:1px solid var(--border-soft);text-align:left;overflow:hidden;text-overflow:ellipsis}
.tracking-td-name-inner{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center}
.tracking-td-ico{grid-row:1 / 3;width:calc(var(--cell) * 0.62);height:calc(var(--cell) * 0.62);object-fit:contain;border-radius:8px}
.tracking-td-pname{font-size:0.95rem;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis}
.tracking-td-classe{font-size:0.75rem;color:var(--text-dim)}

.tracking-td-cell{text-align:center;height:calc(var(--cell) + 4px);border-bottom:1px solid var(--border-soft);background:var(--surface)}
.tracking-tr-perso:hover td{background:var(--row-hover)}

/* Progression */
.tracking-td-prog{padding:0 14px;border-bottom:1px solid var(--border-soft);background:var(--surface)}
.prog-num{display:inline-block;width:3.4em;font-size:0.8rem;font-weight:700;color:var(--text-dim)}
.tracking-td-prog .bar{display:inline-block;width:clamp(40px,3.5vw,70px);vertical-align:middle}
.bar{display:block;height:6px;border-radius:99px;background:var(--bar-bg);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width 0.25s ease}

/* Cases à cocher (Tracking + Dofus) */
.tracking-check,.dofus-cell{width:calc(var(--cell) * 0.66);height:calc(var(--cell) * 0.66);margin:0 auto;border-radius:9px;border:1.5px solid var(--chk-border);background:var(--chk-bg);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell) * 0.32);font-weight:800;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform 0.1s,background var(--t-fast),border-color var(--t-fast)}
.tracking-check:hover,.dofus-cell:hover{border-color:var(--gold)}
.tracking-check:active,.dofus-cell:active{transform:scale(0.9)}
.tracking-check.state2,.dofus-cell.valide{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-text)}
.tracking-check.state1,.dofus-cell.encours{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.tracking-check.state3{background:var(--ko-bg);border-color:var(--ko);color:var(--ko)}

/* ── JETONS ── */
.jetons-th-col{width:calc(var(--cell) * 1.35);min-width:calc(var(--cell) * 1.35)}
.jetons-td-cell{padding:0 4px}
.jetons-input{width:100%;height:calc(var(--cell) * 0.66);background:var(--chk-bg);border:1.5px solid var(--chk-border);border-radius:9px;font-size:0.9rem;font-weight:700;text-align:center;outline:none;transition:border-color var(--t-fast)}
.jetons-input:focus{border-color:var(--gold)}
.jetons-tr-total .jetons-td-total{text-align:center;font-size:0.9rem;font-weight:800;color:var(--gold-text)}

/* ── DOFUS ── */
#view-dofus{--cell:clamp(34px,2vw,60px)}
.dofus-legend{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)}
.dofus-legend-item{display:flex;align-items:center;gap:6px;font-size:0.8rem;font-weight:600;color:var(--text-dim)}
.dofus-legend-dot{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--chk-border);background:var(--chk-bg);flex-shrink:0}
.dofus-legend-dot.encours{background:var(--warn-bg);border-color:var(--warn)}
.dofus-legend-dot.valide{background:var(--ok-bg);border-color:var(--ok)}
.tracking-th-col.special-col img{opacity:0.5}
.tracking-td-cell.special-col .dofus-cell{opacity:0.55}

/* ── KAMAS ── */
.kamas-section{width:min(100%,900px)}
.tracking-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:clamp(16px,1.6vw,28px)}
.tracking-block-title{font-family:'Cinzel',serif;font-size:1rem;font-weight:700;letter-spacing:0.08em;color:var(--gold-text);display:flex;align-items:center;gap:10px;margin-bottom:16px}
.tracking-block-title img{width:32px;height:32px;object-fit:contain}
.kamas-total-row{display:flex;justify-content:center;margin-bottom:14px}
.kamas-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1vw,14px)}
.kamas-card{background:var(--bg);border:1px solid var(--border-soft);border-radius:var(--radius);padding:12px 14px;text-align:center}
.kamas-card.total{background:var(--gold-light);border-color:var(--gold-border);min-width:min(100%,240px)}
.kamas-card-lbl{font-size:0.75rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px}
.kamas-card.total .kamas-card-lbl{color:var(--gold-text)}
.kamas-card-val{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:700;color:var(--gold-text)}
.kamas-input{width:100%;background:var(--surface);border:1.5px solid var(--chk-border);border-radius:8px;padding:8px;font-size:1rem;font-weight:700;color:var(--gold-text);text-align:center;outline:none;transition:border-color var(--t-fast)}
.kamas-input:focus{border-color:var(--gold)}

/* ── TOAST ── */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--toast-bg);color:var(--bg);font-size:0.9rem;font-weight:600;padding:10px 20px;border-radius:24px;z-index:300;pointer-events:none;opacity:0;transition:opacity 0.3s;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.25)}
.toast.show{opacity:1}

/* ── ÉCRANS MOYENS : menu en icônes seules ── */
@media (max-width:1180px) and (min-width:861px){
  :root{--side-w:76px}
  .brand span,.nav-btn span{display:none}
  .brand{justify-content:center;padding:0 0 22px}
  .nav-btn{justify-content:center}
}

/* ── TÉLÉPHONE : menu en bas ── */
@media (max-width:860px){
  :root{--cell:38px;--name-w:128px}
  #view-dofus{--cell:36px}
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:100;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--border);background:var(--surface-blur);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .brand{display:none}
  .nav{flex:1;flex-direction:row;justify-content:space-around}
  .nav-btn{flex:1;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;font-size:0.7rem}
  .nav-btn img{width:26px;height:26px}
  .main{padding:calc(12px + env(safe-area-inset-top)) 10px calc(84px + env(safe-area-inset-bottom))}
  .inner{width:100%}
  .hdr-title{font-size:1.4rem}
  .btn-lbl{display:none}
  .edit-mode-btn,.auth-btn,.theme-toggle{padding:8px 10px}
  .tracking-td-classe,.tracking-th-prog,.tracking-td-prog{display:none}
  .compte-pct{display:inline}
  .tracking-td-name{padding:4px 8px}
  .tracking-td-name-inner{column-gap:6px}
  .tracking-td-ico{grid-row:auto}
  .tracking-td-pname{font-size:0.8rem}
  .tracking-th-name{padding:0 8px}
  .kamas-section{width:100%}
  .toast{bottom:calc(90px + env(safe-area-inset-bottom))}
}
</style>

</head>
<body>

<div class="app">

<!-- MENU : à gauche sur PC, en bas sur téléphone -->
<nav class="side">
  <div class="brand"><img src="apple-touch-icon.png" alt=""><span>Fus-Iron</span></div>
  <div class="nav">
    <button class="nav-btn active" id="nav-tracking" onclick="showView('tracking')">
      <img src="https://api.dofusdb.fr/img/items/20003.png" alt="" onerror="this.style.opacity=0.2"><span>Tracking</span>
    </button>
    <button class="nav-btn" id="nav-jetons" onclick="showView('jetons')">
      <img src="https://api.dofusdb.fr/img/items/136080.png" alt="" onerror="this.style.opacity=0.2"><span>Jetons</span>
    </button>
    <button class="nav-btn" id="nav-dofus" onclick="showView('dofus')">
      <img src="https://api.dofusdb.fr/img/items/23004.png" alt="" onerror="this.style.opacity=0.2"><span>Dofus</span>
    </button>
    <button class="nav-btn" id="nav-kamas" onclick="showView('kamas')">
      <img src="https://api.dofusdu.de/dofus3/v1/img/item/81066-64.png" alt="" onerror="this.style.opacity=0.2"><span>Kamas</span>
    </button>
  </div>
</nav>

<!-- CONTENU -->
<main class="main">
<div class="inner">

  <!-- EN-TÊTE -->
  <header class="hdr">
    <div class="hdr-titles">
      <h1 class="hdr-title" id="hdrTitle">Fus-Iron</h1>
      <div class="hdr-sub hidden" id="hdrSub"></div>
    </div>
    <div class="hdr-actions">
      <button class="edit-mode-btn hidden" id="editModeBtn" onclick="toggleEditMode()">✏️<span class="btn-lbl">Modifier</span></button>
      <button class="auth-btn" id="authBtn" onclick="handleAuth()">⏳</button>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
    </div>
  </header>

  <!-- VUE TRACKING -->
  <div class="view active" id="view-tracking"></div>

  <!-- VUE JETONS -->
  <div class="view" id="view-jetons"></div>

  <!-- VUE DOFUS -->
  <div class="view" id="view-dofus"></div>

  <!-- VUE KAMAS -->
  <div class="view" id="view-kamas"></div>

</div>
</main>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>

// ════════════════════════════════════════════════

var state = {tracking:{}, dofusTracker:{}, jetons:{}};
var nav = {view:'tracking'};

// Données sauvegardées (local + cloud) — une seule liste pour tous les onglets
// Tracking + Kamas → tracking | Dofus → dofusTracker | Jetons → jetons
var STATE_KEYS = ['tracking','dofusTracker','jetons'];

function applyState(src){
  src=src||{};
  STATE_KEYS.forEach(function(k){ state[k]=src[k]||{}; });
  state.updatedAt=src.updatedAt||'';
}

function snapshotState(){
  var snap={};
  STATE_KEYS.forEach(function(k){ snap[k]=state[k]||{}; });
  snap.updatedAt=state.updatedAt||'';
  return snap;
}

function writeLocalState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshotState())); }catch(e){}
}

function loadState(){
  var s={};
  try{ s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')||{}; }catch(e){}
  applyState(s);
  // Purge des anciennes données de la banque (feature supprimée)
  if(s.bank!==undefined) writeLocalState();
}

function saveState(){
  state.updatedAt=new Date().toISOString();
  writeLocalState();
  // Sync Firestore si connecté
  if(window._fbUser && window._fsDb){
    var uid=window._fbUser.uid;
    window._syncPending=true;
    updateSyncDot('syncing');
    clearTimeout(window._syncTimer);
    window._syncTimer=setTimeout(function(){
      // set() remplace tout le document → les anciens champs (ex : bank) disparaissent du cloud
      window._fsDb.collection('users').doc(uid).collection('data').doc('state').set(snapshotState()).then(function(){
        window._syncPending=false;
        updateSyncDot('ok');
      }).catch(function(e){
        console.warn('Firestore save error', e);
        updateSyncDot('offline');
      });
    }, 800); // debounce 800ms pour éviter trop d'écritures
  }
}
function compteOfPerso(pid){
  for(var i=0;i<COMPTES.length;i++){
    for(var j=0;j<COMPTES[i].persos.length;j++){
      if(COMPTES[i].persos[j].id===pid) return COMPTES[i];
    }
  }
  return null;
}

// NAVIGATION

function showView(v){
  document.querySelectorAll('.view').forEach(function(el){el.classList.remove('active');});
  document.getElementById('view-'+v).classList.add('active');
  nav.view=v;
  // Nav buttons
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('nav-'+v).classList.add('active');
  // Header
  var title = document.getElementById('hdrTitle');
  var sub = document.getElementById('hdrSub');
  sub.textContent='';
  sub.classList.add('hidden');
  if(v==='tracking'){
    title.textContent='Tracking';
    sub.textContent='Justicier : '+justicierResetStr().toLowerCase();
    sub.classList.remove('hidden');
    renderTracking();
  } else if(v==='jetons'){
    title.textContent='Jetons';
    renderJetonsTab();
    updateJetonsHeaderDate();
  } else if(v==='dofus'){
    title.textContent='Dofus';
    renderDofusTab();
  } else if(v==='kamas'){
    title.textContent='Kamas';
    renderKamasTab();
  }
  // Bouton Modifier/Enregistrer — visible sur Tracking/Jetons/Dofus/Kamas, toujours réinitialisé en lecture seule au changement d'onglet
  editMode=false;
  var editBtn=document.getElementById('editModeBtn');
  var EDIT_MODE_VIEWS=['tracking','jetons','dofus','kamas'];
  if(EDIT_MODE_VIEWS.indexOf(v)>=0){
    editBtn.classList.remove('hidden');
    editBtn.classList.remove('editing');
    editBtn.innerHTML=EDIT_BTN_OFF;
  } else {
    editBtn.classList.add('hidden');
  }
  var viewEl=document.getElementById('view-'+v);
  if(viewEl) viewEl.classList.add('view-locked');
}

var editMode=false;
// Libellé masqué sur téléphone (classe btn-lbl), seule l'icône reste
var EDIT_BTN_OFF='✏️<span class="btn-lbl">Modifier</span>';
var EDIT_BTN_ON='💾<span class="btn-lbl">Enregistrer</span>';
function toggleEditMode(){
  editMode=!editMode;
  var editBtn=document.getElementById('editModeBtn');
  var viewEl=document.getElementById('view-'+nav.view);
  if(editMode){
    editBtn.classList.add('editing');
    editBtn.innerHTML=EDIT_BTN_ON;
    if(viewEl) viewEl.classList.remove('view-locked');
  } else {
    editBtn.classList.remove('editing');
    editBtn.innerHTML=EDIT_BTN_OFF;
    if(viewEl) viewEl.classList.add('view-locked');
    showToast('Modifications enregistrées');
  }
}

  t.textContent=msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

    firebase.initializeApp(FIREBASE_CONFIG);
    window._fsDb = firebase.firestore();
    // Persistence offline (cache local si pas de connexion)
    window._fsDb.enablePersistence({synchronizeTabs:true}).catch(function(){});

    firebase.auth().onAuthStateChanged(function(user){
      window._fbUser = user;
      if(user){
        updateAuthBtn(user);
        loadFromFirestore(function(){
          if(nav.view==='tracking') renderTracking();
          if(nav.view==='jetons') renderJetonsTab();
          if(nav.view==='dofus') renderDofusTab();
          if(nav.view==='kamas') renderKamasTab();
        });
      } else {
        updateAuthBtn(null);
      }
    });
  }catch(e){
    console.warn('Firebase init error', e);
  }
}

function loadFromFirestore(cb){
  if(!window._fbUser || !window._fsDb){ if(cb) cb(); return; }
  updateSyncDot('syncing');
  window._fsDb.collection('users').doc(window._fbUser.uid)
    .collection('data').doc('state').get()
    .then(function(doc){
      if(doc.exists){
        var d=doc.data();
        // Merge : Firestore gagne sur localStorage sauf si localStorage est plus récent
        var localRaw=null;
        try{ localRaw=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); }catch(e){}
        var localUpdated=localRaw&&localRaw.updatedAt?localRaw.updatedAt:'';
        var remoteUpdated=d.updatedAt||'';
        if(remoteUpdated>=localUpdated){
          applyState(d);
          // Cache local complet (mêmes données que le cloud, pour les 4 onglets)
          writeLocalState();
          // Purge des anciennes données de la banque dans le cloud (feature supprimée)
          if(d.bank!==undefined) saveState();
        } else {
          // localStorage plus récent → on upload vers Firestore
          saveState();
        }
      } else {
        // Première connexion : on upload le localStorage existant
        saveState();
      }
      updateSyncDot('ok');
      if(cb) cb();
    }).catch(function(e){
      console.warn('Firestore load error', e);
      updateSyncDot('offline');
      if(cb) cb();
    });
}

function handleAuth(){
  if(window._fbUser){
    // Déjà connecté → proposer déconnexion
    if(confirm('Te déconnecter de la synchro cloud ? Tes données restent en local.')){
      firebase.auth().signOut();
    }
  } else {
    // Connexion Google
    var provider = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(provider).catch(function(e){
      showToast('Connexion annulée');
    });
  }
}

// État de la synchro cloud, affiché par un point dans le bouton de connexion
var SYNC_LABELS={ok:'Synchro cloud OK',syncing:'Synchronisation…',offline:'Hors ligne'};
window._syncStatus='syncing';

function updateAuthBtn(user){
  var btn=document.getElementById('authBtn');
  if(!btn) return;
  if(user){
    var name=user.displayName?user.displayName.split(' ')[0]:user.email;
    var st=window._syncStatus;
    btn.innerHTML='<span class="sync-dot '+st+'"></span><span class="btn-lbl"></span>';
    btn.querySelector('.btn-lbl').textContent=name;
    btn.title=SYNC_LABELS[st]+' — cliquer pour déconnecter';
  } else {
    btn.innerHTML='☁️<span class="btn-lbl">Sync</span>';
    btn.title='Se connecter pour synchroniser sur tous tes appareils';
  }
}

function updateSyncDot(status){
  window._syncStatus=status;
  if(window._fbUser) updateAuthBtn(window._fbUser);
}

function getTrackingState(){
  if(!state.tracking) state.tracking={};
  var t=state.tracking;
  if(!t.kamas) t.kamas={};
  if(!t.justicier) t.justicier={};
  if(!t.parcho) t.parcho={};
  if(!t.parangon) t.parangon={};
  if(!t.acces) t.acces={};
  if(!t.lastReset) t.lastReset=null;
  checkJusticierReset();
  return t;
}

function checkJusticierReset(){
  var t=state.tracking;
  if(!t) return;
  var now=new Date();
  var lastReset=t.lastReset?new Date(t.lastReset):null;
  var d=new Date(now);
  d.setHours(0,0,0,0);
  while(d.getDay()!==2) d.setDate(d.getDate()-1);
  if(!lastReset||lastReset<d){
    t.justicier={};
    t.lastReset=d.toISOString();
  }
}

function getJetonsState(){
  if(!state.jetons) state.jetons={};
  JETON_COLUMNS.forEach(function(col){
    if(!state.jetons[col.key]) state.jetons[col.key]={};
  });
  return state.jetons;
}

function setJetonValue(el){
  var jkey=el.getAttribute('data-jkey');
  var pid=el.getAttribute('data-pid');
  var v=parseInt(el.value)||0;
  if(v<0) v=0;
  if(v>99999) v=99999;
  var j=getJetonsState();
  j[jkey][pid]=v;
  j._lastUpdated=new Date().toISOString();
  saveState();
  el.value=v||'';
  // Mettre à jour le total du compte pour cette colonne uniquement
  var c=compteOfPerso(pid);
  if(c){
    var total=c.persos.reduce(function(sum,p){ return sum+(j[jkey][p.id]||0); },0);
    var totalEl=document.querySelector('[data-jtotal="'+jkey+'-'+c.id+'"]');
    if(totalEl) totalEl.textContent=total||'';
  }
  updateJetonsHeaderDate();
}

function updateJetonsHeaderDate(){
  var sub=document.getElementById('hdrSub');
  if(!sub||nav.view!=='jetons') return;
  var j=getJetonsState();
  if(j._lastUpdated){
    var d=new Date(j._lastUpdated);
    var dd=String(d.getDate()).padStart(2,'0');
    var mm=String(d.getMonth()+1).padStart(2,'0');
    var yyyy=d.getFullYear();
    sub.textContent='Mis à jour le '+dd+'/'+mm+'/'+yyyy;
    sub.classList.remove('hidden');
  } else {
    sub.textContent='';
    sub.classList.add('hidden');
  }
}

function formatKamas(val){
  if(!val||isNaN(val)) return '0';
  var s=Math.floor(val).toString();var r='';for(var i=0;i<s.length;i++){if(i>0&&(s.length-i)%3===0)r+=' ';r+=s[i];}return r;
}

function parseKamas(str){
  return parseInt((str||'').replace(/[^0-9]/g,''))||0;
}

function setKamas(compteId, val){
  var t=getTrackingState();
  t.kamas[compteId]=Math.min(parseKamas(val),999999999);
  saveState();
  var el=document.getElementById('kamasTotal');
  if(el){
    var total=COMPTES.reduce(function(sum,c){ return sum+(t.kamas[c.id]||0); },0);
    el.textContent=formatKamas(total)+' K';
  }
}

function cycleAccesCell(pid, accesId){
  var t=getTrackingState();
  if(!t.acces) t.acces={};
  var key=pid+'_'+accesId;
  var cur=t.acces[key]||0;
  t.acces[key]=(cur+1)%2;
  saveState();
  updateTrackingProgress(pid);
  var btn=document.querySelector('[data-acell="'+key+'"]');
  if(btn){
    var v=t.acces[key];
    btn.className='tracking-check'+(v===1?' state2':'');
    btn.textContent=v===1?'✓':'';
  }
}

// Prochain reset du Justicier (mardi)
function justicierResetStr(){
  var now=new Date();
  var next=new Date(now);
  next.setHours(0,0,0,0);
  next.setDate(next.getDate()+((2-next.getDay()+7)%7||7));
  var diff=next-now;
  var days=Math.floor(diff/86400000);
  var hours=Math.floor((diff%86400000)/3600000);
  return 'Reset dans '+days+'j '+hours+'h';
}

// Cellule nom + icône de classe, commune aux tableaux Tracking, Jetons et Dofus
function persoNameCell(p){
  var h='<td class="tracking-td-name"><div class="tracking-td-name-inner">';
  h+='<img class="tracking-td-ico" src="'+CLASS_ICONS[p.classe]+'" alt="'+p.classe+'">';
  h+='<span class="tracking-td-pname">'+p.name+'</span>';
  h+='<span class="tracking-td-classe">'+p.classe+'</span>';
  h+='</div></td>';
  return h;
}

// ── PROGRESSION (compteurs par perso, % par compte) ──
function progCell(done, total, attr){
  return '<td class="tracking-td-prog" '+attr+'>'+progInner(done,total)+'</td>';
}
function progInner(done, total){
  return '<span class="prog-num">'+done+'/'+total+'</span><span class="bar"><i style="width:'+Math.round(done*100/total)+'%"></i></span>';
}
function comptePctInner(done, total){
  var pct=Math.round(done*100/total);
  return '<span class="prog-num">'+pct+'%</span><span class="bar"><i style="width:'+pct+'%"></i></span>';
}
function setProgress(prefix, pid, doneFn, total){
  var c=compteOfPerso(pid);
  var el=document.querySelector('['+prefix+'-pprog="'+pid+'"]');
  if(el) el.innerHTML=progInner(doneFn(pid),total);
  if(!c) return;
  var cd=c.persos.reduce(function(s,p){ return s+doneFn(p.id); },0);
  var ct=total*c.persos.length;
  var cel=document.querySelector('['+prefix+'-cprog="'+c.id+'"]');
  if(cel) cel.innerHTML=comptePctInner(cd,ct);
  var pct=document.querySelector('['+prefix+'-cpct="'+c.id+'"]');
  if(pct) pct.textContent=Math.round(cd*100/ct)+'%';
}

// Tracking : 13 colonnes. Parangon fait = ✓ (parangon obtenu) ou ✕ (Dofus Vulbis déjà obtenu).
var TRACKING_TOTAL=ACCES_LIST.length+5;
function trackingDone(pid){
  var t=getTrackingState();
  var n=0;
  ACCES_LIST.forEach(function(a){ if(t.acces&&t.acces[pid+'_'+a.id]===1) n++; });
  if(t.justicier[pid]===1) n++;
  if(t.parcho&&t.parcho[pid]===1) n++;
  if(t.parangon&&(t.parangon[pid]===2||t.parangon[pid]===3)) n++;
  if(t.armeChasse&&t.armeChasse[pid]===1) n++;
  if(t.chasseur200&&t.chasseur200[pid]===1) n++;
  return n;
}
function updateTrackingProgress(pid){ setProgress('data-t', pid, trackingDone, TRACKING_TOTAL); }

function renderTracking(){
  var t=getTrackingState();
  var resetStr=justicierResetStr();

  // ── TABLEAU ACTIVITÉS EN PLEINE PAGE (comme Dofus) ──
  var h='<div class="tracking-section">';
  h+='<div class="tracking-wrap">';
  h+='<table class="tracking-table"><thead><tr>';
  h+='<th class="tracking-th-name">Personnage</th>';
  ACCES_LIST.forEach(function(a){
    h+='<th class="tracking-th-col" title="Accès '+a.name+'"><img src="'+a.icon+'" alt="'+a.name+'" onerror="this.style.opacity=0.2"></th>';
  });
  h+='<th class="tracking-th-col sep" title="Justicier - '+resetStr+'"><img src="'+JUSTICIER_ICO+'" onerror="this.style.opacity=0.2"></th>';
  h+='<th class="tracking-th-col" title="Full Parcho"><img src="'+PARCHO_ICO+'" onerror="this.style.opacity=0.2"></th>';
  h+='<th class="tracking-th-col" title="Parangon"><img src="'+PARANGON_ICO+'" onerror="this.style.opacity=0.2"></th>';
  h+='<th class="tracking-th-col" title="Arme de chasse"><img src="'+CHASSE_ARME_ICO+'" onerror="this.style.opacity=0.2"></th>';
  h+='<th class="tracking-th-col" title="Chasseur 200"><img src="'+CHASSEUR200_ICO+'" onerror="this.style.opacity=0.2"></th>';
  h+='<th class="tracking-th-prog">Prog.</th>';
  h+='</tr></thead><tbody>';

  COMPTES.forEach(function(c){
    var cd=c.persos.reduce(function(s,p){ return s+trackingDone(p.id); },0);
    var ct=TRACKING_TOTAL*c.persos.length;
    h+='<tr class="tracking-tr-compte"><td class="tracking-td-name">'+c.name+'<span class="compte-pct" data-t-cpct="'+c.id+'">'+Math.round(cd*100/ct)+'%</span></td>';
    h+='<td colspan="'+TRACKING_TOTAL+'"></td>';
    h+='<td class="tracking-td-prog" data-t-cprog="'+c.id+'">'+comptePctInner(cd,ct)+'</td></tr>';
    c.persos.forEach(function(p){
      var vj=t.justicier[p.id]||0;
      var vp=(t.parcho&&t.parcho[p.id])||0;
      var vpar=(t.parangon&&t.parangon[p.id])||0;
      var vca=(t.armeChasse&&t.armeChasse[p.id])||0;
      var vc200=(t.chasseur200&&t.chasseur200[p.id])||0;

      var jClass='tracking-check'+(vj===1?' state2':'');
      var jIcon=vj===1?'✓':'';

      var pClass='tracking-check'+(vp===1?' state2':'');
      var pIcon=vp===1?'✓':'';

      var parClass='tracking-check'+(vpar===1?' state1':vpar===2?' state2':vpar===3?' state3':'');
      var parIcon=vpar===1?'●':vpar===2?'✓':vpar===3?'✕':'';

      var caClass='tracking-check'+(vca===1?' state2':'');
      var caIcon=vca===1?'✓':'';

      var c200Class='tracking-check'+(vc200===1?' state2':'');
      var c200Icon=vc200===1?'✓':'';

      h+='<tr class="tracking-tr-perso">';
      // Nom + icône classe (colonne fixe)
      h+=persoNameCell(p);
      // Accès (8 colonnes)
      ACCES_LIST.forEach(function(a){
        var key=p.id+'_'+a.id;
        var v=(t.acces&&t.acces[key])||0;
        var accCls='tracking-check'+(v===1?' state2':'');
        var accIcon=v===1?'✓':'';
        h+='<td class="tracking-td-cell"><div class="'+accCls+'" data-acell="'+key+'" onclick="cycleAccesCell(\''+p.id+'\',\''+a.id+'\')">'+accIcon+'</div></td>';
      });
      // Justicier
      h+='<td class="tracking-td-cell sep"><div class="'+jClass+'" data-jpid="'+p.id+'" onclick="cycleJusticier(this.dataset.jpid)">'+jIcon+'</div></td>';
      // Full Parcho
      h+='<td class="tracking-td-cell"><div class="'+pClass+'" data-ppid="'+p.id+'" onclick="cycleParcho(this.dataset.ppid)">'+pIcon+'</div></td>';
      // Parangon
      h+='<td class="tracking-td-cell"><div class="'+parClass+'" data-parpid="'+p.id+'" onclick="cycleParangon(this.dataset.parpid)">'+parIcon+'</div></td>';
      // Arme de chasse
      h+='<td class="tracking-td-cell"><div class="'+caClass+'" data-acpid="'+p.id+'" onclick="cycleArmeChasse(this.dataset.acpid)">'+caIcon+'</div></td>';
      // Chasseur 200
      h+='<td class="tracking-td-cell"><div class="'+c200Class+'" data-c200pid="'+p.id+'" onclick="cycleChasseur200(this.dataset.c200pid)">'+c200Icon+'</div></td>';
      // Progression du perso
      h+=progCell(trackingDone(p.id), TRACKING_TOTAL, 'data-t-pprog="'+p.id+'"');
      h+='</tr>';
    });
  });

  h+='</tbody></table></div>';
  h+='</div>';

  document.getElementById('view-tracking').innerHTML=h;
}


// ════════════════════════════════════════════════
// DOFUS TRACKER
// ════════════════════════════════════════════════
function getDofusTrackerState(){
  if(!state.dofusTracker) state.dofusTracker={};
  return state.dofusTracker;
}

function cycleArmeChasse(pid){
  var t=getTrackingState();
  if(!t.armeChasse) t.armeChasse={};
  var cur=t.armeChasse[pid]||0;
  t.armeChasse[pid]=(cur+1)%2;
  saveState();
  updateTrackingProgress(pid);
  var btn=document.querySelector('[data-acpid="'+pid+'"]');
  if(btn){
    var v=t.armeChasse[pid];
    btn.className='tracking-check'+(v===1?' state2':'');
    btn.textContent=v===1?'✓':'';
  }
}

function cycleChasseur200(pid){
  var t=getTrackingState();
  if(!t.chasseur200) t.chasseur200={};
  var cur=t.chasseur200[pid]||0;
  t.chasseur200[pid]=(cur+1)%2;
  saveState();
  updateTrackingProgress(pid);
  var btn=document.querySelector('[data-c200pid="'+pid+'"]');
  if(btn){
    var v=t.chasseur200[pid];
    btn.className='tracking-check'+(v===1?' state2':'');
    btn.textContent=v===1?'✓':'';
  }
}

function cycleDofusCell(pid, dofusId){
  var d=getDofusTrackerState();
  var key=pid+'_'+dofusId;
  var cur=d[key]||0;
  d[key]=(cur+1)%3;
  saveState();
  updateDofusProgress(pid);
  var cell=document.querySelector('[data-dcell="'+key+'"]');
  if(cell){
    var v=d[key];
    cell.className='dofus-cell'+(v===1?' encours':v===2?' valide':'');
    cell.textContent=v===1?'\u25CF':v===2?'\u2713':'';
  }
}

// Dofus : un Dofus compte comme fait quand il est validé (✓), pas quand il est en cours (●)
function dofusDone(pid){
  var d=getDofusTrackerState();
  return DOFUS_TRACKER_LIST.reduce(function(n,df){ return n+(d[pid+'_'+df.id]===2?1:0); },0);
}
function updateDofusProgress(pid){ setProgress('data-d', pid, dofusDone, DOFUS_TRACKER_LIST.length); }

function renderDofusTab(){
  var d=getDofusTrackerState();
  var total=DOFUS_TRACKER_LIST.length;
  var h='<div class="dofus-legend">';
  h+='<div class="dofus-legend-item"><div class="dofus-legend-dot"></div>Non commencé</div>';
  h+='<div class="dofus-legend-item"><div class="dofus-legend-dot encours"></div>En cours ●</div>';
  h+='<div class="dofus-legend-item"><div class="dofus-legend-dot valide"></div>Validé ✓</div>';
  h+='</div>';
  h+='<div class="tracking-section">';
  h+='<div class="tracking-wrap">';
  h+='<table class="tracking-table"><thead><tr>';
  h+='<th class="tracking-th-name">Personnage</th>';
  DOFUS_TRACKER_LIST.forEach(function(df){
    var sc=df.special?' special-col':'';
    var ico=df.icon?'<img src="'+df.icon+'" alt="'+df.name+'" onerror="this.style.opacity=0.2">':'<span>'+df.name+'</span>';
    h+='<th class="tracking-th-col'+sc+'" title="'+df.name+'">'+ico+'</th>';
  });
  h+='<th class="tracking-th-prog">Prog.</th>';
  h+='</tr></thead><tbody>';
  COMPTES.forEach(function(c){
    var cd=c.persos.reduce(function(s,p){ return s+dofusDone(p.id); },0);
    var ct=total*c.persos.length;
    h+='<tr class="tracking-tr-compte"><td class="tracking-td-name">'+c.name+'<span class="compte-pct" data-d-cpct="'+c.id+'">'+Math.round(cd*100/ct)+'%</span></td>';
    h+='<td colspan="'+total+'"></td>';
    h+='<td class="tracking-td-prog" data-d-cprog="'+c.id+'">'+comptePctInner(cd,ct)+'</td></tr>';
    c.persos.forEach(function(p){
      h+='<tr class="tracking-tr-perso">';
      h+=persoNameCell(p);
      DOFUS_TRACKER_LIST.forEach(function(df){
        var key=p.id+'_'+df.id;
        var v=d[key]||0;
        var cls='dofus-cell'+(v===1?' encours':v===2?' valide':'');
        var icon=v===1?'●':v===2?'✓':'';
        var sc=df.special?' special-col':'';
        h+='<td class="tracking-td-cell'+sc+'">';
        h+='<div class="'+cls+'" data-dcell="'+key+'" onclick="cycleDofusCell(\''+p.id+'\',\''+df.id+'\')">'+icon+'</div>';
        h+='</td>';
      });
      h+=progCell(dofusDone(p.id), total, 'data-d-pprog="'+p.id+'"');
      h+='</tr>';
    });
  });
  h+='</tbody></table></div></div>';
  document.getElementById('view-dofus').innerHTML=h;
}

// ════════════════════════════════════════════════
// DARK MODE
// ════════════════════════════════════════════════
function applyTheme(dark){
  document.documentElement.setAttribute('data-theme', dark?'dark':'light');
  var btn=document.getElementById('themeToggle');
  if(btn) btn.textContent=dark?'☀️':'🌙';
}

function toggleTheme(){
  var isDark=document.documentElement.getAttribute('data-theme')==='dark';
  var next=!isDark;
  applyTheme(next);
  try{ localStorage.setItem('iron_theme', next?'dark':'light'); }catch(e){}
}

// Appliquer thème sauvegardé
(function(){
  var saved=null;
  try{ saved=localStorage.getItem('iron_theme'); }catch(e){}
  applyTheme(saved==='dark');
})();

// ════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════
loadState();
renderTracking();
renderJetonsTab();
renderDofusTab();
renderKamasTab();
// icônes nav intégrées directement dans le HTML
showView('tracking');
// Firebase init (après le rendu initial depuis localStorage)
initFirebase();
</script>
